# 上线(docs/运营规则.md 6 章)。只由人手动运行: gh workflow run release.yml -f version=1.3.0(或在网页上运行)。
# 闸门: 运行者是批准人(不是机器人),上个版本之后合并的每个 PR 都有人加的 已验收 / 免验收,要发布的提交上 full-test 成功。
# 若套餐支持,给 production 环境设"必须审批"和"禁止自我审批",作为第二道关卡。
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号(例 1.3.0)
        required: true
permissions:
  contents: read
concurrency: release
jobs:
  release-gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 版本号的形式和标签(新的发布)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "版本号要是 x.y.z"; exit 1; }
          ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || { echo "v$VERSION 已经存在"; exit 1; }
      - name: 闸门
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
        run: python scripts/github/gates.py release --actor "$ACTOR"
  release:
    needs: release-gate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 再查一次运行者(只重跑这个作业时闸门不会再跑)
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: python scripts/github/gates.py actor --actor "$ACTOR"
      - name: 打标签、建 Release(重跑时已有的就跳过)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if existing="$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}")"; then
            [ "$existing" = "$GITHUB_SHA" ] || { echo "v$VERSION 已指向别的提交"; exit 1; }
          else
            git tag -a "v$VERSION" -m "v$VERSION(由 $ACTOR 发布)"
            git push origin "v$VERSION"
          fi
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag
      - name: 部署
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -x scripts/deploy.sh ]; then bash scripts/deploy.sh "$VERSION"; else echo "还没有 scripts/deploy.sh:请按项目写部署命令"; fi

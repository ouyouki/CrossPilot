      row.classList.toggle('unans',!val); row.classList.toggle('hit',val==='y'&&f[0]!=='food');
      row.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.v===val); });
      var sm=row.querySelector('small'); sm.textContent=!val?'未回答 · 必须选择':(val==='y'&&f[0]!=='food')?'命中 → 不可售，不能进入素材':(val==='y'?'有 · 厨房小工具白名单允许，检测报告已附':f[2]); });
    $('#fl-n').innerHTML=un?'<span class="badge wait">'+un+' 项未答</span>':'<span class="badge ok">7 / 7</span>';
    /* 清单 */
    var n=p.ck.filter(Boolean).length; $('#ck-n').textContent='已勾 '+n+' / 5'; $('#ck-m').className='meter '+(n===5?'ok':'wait'); $('#ck-m i').style.width=(n/5*100)+'%';
    /* 卡片环 */
    var kc=document.querySelector('.kc[data-src="'+cur+'"]');
    if(kc){ var rg=kc.querySelector('.rg'), col=v.block.length?'block':okAll?'ok':'wait';
      rg.innerHTML=CP.chart.ring({pct:v.pct,size:36,stroke:4,label:okAll?'✓':String(v.pct),fs:okAll?11:10,color:col});
      var ma=kc.querySelector('.m.a'); if(ma){ ma.textContent=p.autoOk?'带入值已确认':'已自动带入 · 待确认'; ma.classList.toggle('done',!!p.autoOk); }
      var m=kc.querySelector('.m'); if(p.st!=='ok'){ m.className='m '+(v.block.length?'b':okAll?'o':'w'); m.textContent=v.block.length?v.block[0].replace(/（.*/,''):okAll?'可以确认':(v.miss[0]==='重量'?'缺重量':'请补：'+v.miss[0]); } }
    aside(p,v,r);
  }
  function aside(p,v,r){
    var a=$('#aside'); if(!a) return;
    var okAll=!v.miss.length&&!v.block.length;
    function st(cls,ic,t,s){ return '<li><span class="ic '+cls+'">'+ic+'</span><div><b>'+t+'</b><span class="s">'+s+'</span></div></li>'; }
    var imgMiss=v.miss.filter(function(m){return /^图/.test(m);}).length;
    var flMiss=v.miss.filter(function(m){return /旗标/.test(m);})[0], flHit=v.block.filter(function(m){return /属性/.test(m);})[0];
    var n=p.ck.filter(Boolean).length;
    var h='<div class="dhead" style="display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center"><div class="ph" data-art="'+p.art+'" style="border-radius:16px"></div><div><div class="small faint">货源 · 候选 #'+p.cand+'</div><h3 lang="ja" style="font-size:17px;letter-spacing:0;color:var(--text);margin:2px 0 0;line-height:1.4">'+p.ja+'</h3></div></div>'
      +'<div class="row" style="margin:14px 0 4px;gap:14px"><div class="chart" data-chart="ring" data-cfg=\''+JSON.stringify({pct:v.pct,size:84,stroke:9,label:v.pct+'%',sub:'完成度',fs:17,color:v.block.length?'block':okAll?'ok':'wait'})+'\'></div>'
      +'<dl class="kv" style="flex:1"><dt>售价</dt><dd>'+yen(p.price)+'</dd><dt>精确毛利</dt><dd>'+(r.m===null?'<span style="color:var(--wait)">不可算</span>':'<b>'+r.m.toFixed(1)+'%</b>')+'</dd><dt>首批资金</dt><dd>'+(r.c1!==null&&String(p.moq).trim()?yen(r.c1*(+p.moq))+'<span class="faint small">（MOQ × c1）</span>':'不可算')+'</dd></dl></div>'
      +'<h3>采集箱处理</h3><ul class="stepv">'
      +(p.auto?(p.autoOk?st('ok','✓','采集工具带入',Object.keys(p.auto).length+' 项 · 来源 B · 已确认'):st('w','!','采集工具带入',Object.keys(p.auto).length+' 项 · 来源 B · 待你确认')):'')
      +st('ok','✓','去重',p.dup||'未发现同源')
      +(p.brandHit?(p.brandOk?st('ok','✓','品牌 / IP 初筛','命中「'+esc(p.brandHit)+'」· 已人工确认'):st('w','!','品牌 / IP 初筛','命中「'+esc(p.brandHit)+'」· 需人工确认')):st('ok','✓','品牌 / IP 初筛','未命中'))
      +(flHit?st('b','✗','属性旗标',flHit):flMiss?st('w','!','属性旗标',flMiss.replace('属性旗标 ','')+'未答'):st('ok','✓','属性旗标','7 / 7 已回答'))
      +(!v.tOk?st('w','!','发货时效','请补'):v.t>DISPATCH-BUF?st('b','✗','发货时效',v.t+' 天，超过 '+(DISPATCH-BUF)+' 天 → BLOCK'):st('ok','✓','发货时效',v.t+' / '+(DISPATCH-BUF)+' 天'))
      +(imgMiss?st('w','!','图片授权',imgMiss+' 张待补'):st('ok','✓','图片授权',p.imgs.filter(function(i){return i.lt==='none';}).length+' 张 none 仅内部比对'))
      +(n<5?st('w','!','确认清单',n+' / 5'):st('ok','✓','确认清单','5 / 5'))
      +(okAll?st('ok','✓','SOURCED','确认后素材自动开始生成'):st('','·','SOURCED','条件满足后可确认'))
      +'</ul>'
      +(p.st==='ok'?'<a class="btn sm" href="05-assets.html">去看素材</a>':'<p class="small muted" style="margin:0">确认后进入 <a href="05-assets.html">素材</a>；none 图不会进入生成管线。</p>');
    a.innerHTML=h; CP.hydrate(a);
  }
  /* ---------- 事件 ---------- */
  document.addEventListener('click',function(e){
    var k=e.target.closest('.kc[data-src]'); if(k){ render(+k.dataset.src); return; }
    var fb=e.target.closest('.fr .seg button'); if(fb){ P[cur].flags[fb.closest('.fr').dataset.f]=fb.dataset.v; update(); return; }
    if(e.target.closest('#autook')){ P[cur].autoOk=true; render(cur); return; }
    var up=e.target.closest('[data-up]'); if(up){ P[cur].imgs[+up.dataset.up].ev='授权证据.pdf（演示）'; CP.toast('已上传授权证据（演示）'); update(); }
  });
  function onField(e){
    var t=e.target, p=P[cur]; if(!p) return;
    if(t.dataset.k){ p[t.dataset.k]=t.value; update(); }
    else if(t.dataset.img){ p.imgs[+t.dataset.img].lt=t.value; update(); }
    else if(t.dataset.chain){ p.imgs[+t.dataset.chain].chain=t.value; update(); }
    else if(t.dataset.ck){ p.ck[+t.dataset.ck]=t.checked?1:0; update(); }
    else if(t.id==='brandok'){ p.brandOk=t.checked; update(); }
  }
  document.addEventListener('input',onField); document.addEventListener('change',onField);
  render(5);
})();
</script>
</body>
</html>

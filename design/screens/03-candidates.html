<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>选品 · CrossPilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/cp2.css">
<style>
  [hidden]{display:none!important}
  .menu{position:relative}
  .menu > summary{list-style:none}
  .menu > summary::-webkit-details-marker{display:none}
  .menu > summary::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:2px}
  .menu .pop{position:absolute;right:0;top:40px;z-index:30;width:280px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-2);padding:6px}
  .menu .pop button{display:flex;width:100%;gap:10px;align-items:flex-start;text-align:left;border:0;background:transparent;border-radius:9px;padding:9px 10px;cursor:pointer}
  .menu .pop button:hover{background:var(--surface-2)}
  .menu .pop button[disabled]{cursor:not-allowed;opacity:.55}
  .menu .pop b{display:block;font-weight:600;font-size:15px}
  .menu .pop small{display:block;font-size:14px;color:var(--text-3);line-height:1.4}
  .band{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
  .band .side{display:grid;gap:12px;align-content:start}
  .minic{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-1);padding:14px 16px}
  .minic h3{font-size:14px;font-weight:600;color:var(--text-2);margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .minic h3 .r{margin-left:auto;font-weight:400;color:var(--text-3)}
  #scatter svg{width:100%}
  .stackthumbs{display:flex;padding-left:8px}
  .stackthumbs .thumb{width:36px;height:36px;border-radius:10px;margin-left:-8px;box-shadow:0 0 0 2px var(--surface)}
  .sc{display:flex;align-items:center;gap:8px;cursor:help}
  .scbar{width:56px;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;display:block}
  .scbar i{display:block;height:100%;background:var(--primary);border-radius:3px}
  .sc b{font-weight:600;min-width:20px}
  .tbl td.why{font-size:14px;color:var(--text-2);min-width:170px;max-width:220px;line-height:1.5}
  .flags{display:flex;flex-wrap:wrap;gap:4px}
  .tbl .prod{min-width:250px}.tbl .prod .t{white-space:nowrap}.tbl .prod .s{white-space:nowrap}
  .tbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary)}
  .tbl.cand td{padding:10px 10px} .tbl.cand th{padding:8px 10px}
  .pane-tools{display:flex;align-items:center;gap:10px;padding:14px 20px 12px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;padding:4px 20px 20px}
  .pcard{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-1);overflow:hidden;cursor:pointer;position:relative;transition:box-shadow .12s}
  .pcard:hover{box-shadow:var(--shadow-2)}
  .pcard.sel{box-shadow:0 0 0 2px var(--primary),var(--shadow-2)}
  .pcard .ph{border-radius:0;aspect-ratio:16/11}
  .pcard .pk{position:absolute;left:10px;top:10px;background:var(--surface);border-radius:8px;width:28px;height:28px;display:grid;place-items:center;box-shadow:var(--shadow-1)}
  .pcard .pk input{width:16px;height:16px;accent-color:var(--primary)}
  .pcard .pc-b{padding:10px 12px 12px}
  .pcard .t{font-weight:600;font-size:15px;line-height:1.35}
  .pcard .s{font-size:14px;color:var(--text-3)}
  .imp .body{display:grid;gap:12px}
  .impg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .impc{background:var(--surface);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow-1)}
  .impc b{font-size:15px} .impc p{margin:4px 0 10px;font-size:14px;color:var(--text-3);line-height:1.5}
  .impc.off{background:var(--surface-2);box-shadow:none}
  .syncg{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
  .syncg .impc .seg button{height:26px;font-size:13.5px;padding:0 10px}
  .src{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap}
  .src.a{background:var(--info-bg);color:var(--info)}
  .src.m{background:var(--surface-3);color:var(--text-2)}
  @media (max-width:1400px){.syncg{grid-template-columns:1fr}}
  .warnbar{position:sticky;bottom:12px;z-index:6;margin-top:14px;box-shadow:var(--shadow-2)}
  .dhead{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;margin-bottom:12px}
  .dhead .ph{border-radius:16px}
  .dhead h2{font-size:17px;line-height:1.4}
  .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 6px}
  .kpis div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
  .kpis small{display:block;font-size:13px;color:var(--text-3)}
  .kpis b{font-size:19px;font-weight:600}
  .kpis .na b{font-size:15px;color:var(--wait)}
  .g0{list-style:none;margin:0;padding:0;font-size:14px}
  .g0 li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;padding:6px 0;border-top:1px solid var(--border);align-items:start}
  .g0 li:first-child{border-top:0}
  .g0 .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600}
  .g0 .ic.y{background:var(--ok-bg);color:var(--ok)} .g0 .ic.n{background:var(--block-bg);color:var(--block)}
  .g0 .src{color:var(--text-3);font-size:13px;text-align:right}
  .ctab{width:100%;border-collapse:collapse;font-size:14px}
  .ctab td{padding:5px 0;border-top:1px solid var(--border);vertical-align:top}
  .ctab td:last-child{text-align:right;white-space:nowrap}
  .ctab .sub{display:block;color:var(--text-3);font-size:13px}
  .ctab tr.tot td{font-weight:600}
  .ctab tr.miss td{color:var(--block);background:var(--block-bg)}
  .mcost{display:grid;gap:6px;font-size:14px}
  .mcost .r{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;gap:8px;align-items:center}
  .mcost .bar{height:12px;border-radius:4px;background:var(--s1)}
  .mcost .bar.rev{background:var(--primary)} .mcost .bar.fee{background:var(--s4)}
  .mcost .bar.miss{background:repeating-linear-gradient(135deg,var(--block-bg) 0 5px,color-mix(in srgb,var(--block) 35%,transparent) 5px 8px);outline:1.5px dashed var(--block)}
  .mcost .r.m span:first-child,.mcost .r.m b{color:var(--block);font-weight:600}
  .mcost b{text-align:right;font-weight:600}
  .bigna{background:var(--wait-bg);color:var(--wait);border-radius:12px;padding:12px 14px;margin:8px 0}
  .bigna b{display:block;font-size:20px}
  .why1{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:15px}
  .reasons{display:flex;flex-wrap:wrap;gap:6px}
  .dimhead .ph{filter:grayscale(1);opacity:.6}
  @media (max-width:1400px){.band{grid-template-columns:1fr}.band .side{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>

<script>
(function(){
  var $=function(s){return document.querySelector(s);};
  var D=[{"i": 1, "a": "box", "n": "折叠収納ボックス3個セット", "m": 31.7, "s": 82, "x": 98}, {"i": 2, "a": "spoons", "n": "シリコン調理スプーン5点セット", "m": 34.2, "s": 79, "x": 94}, {"i": 3, "a": "cable", "n": "デスクケーブルオーガナイザー", "m": 29.8, "s": 76, "x": 92}, {"i": 4, "a": "brush", "n": "ペット用ブラシ 抜け毛クリーナー", "m": 33.0, "s": 74, "x": 84}, {"i": 5, "a": "cup", "n": "折りたたみシリコンカップ", "m": 28.4, "s": 71, "x": 90}, {"i": 6, "a": "rack", "n": "キッチン水切りラック", "m": 27.1, "s": 68, "x": 97}, {"i": 7, "a": "divider", "n": "引き出し仕切り板", "m": 30.2, "s": 66, "x": 66}, {"i": 8, "a": "hooks", "n": "マグネットフック6個入", "m": 26.0, "s": 63, "x": 80}, {"i": 9, "a": "rack", "n": "シンク下収納ラック", "m": 22.5, "s": 58, "x": 80}, {"i": 10, "a": "divider", "n": "シューズラック", "m": 19.8, "s": 55, "x": 85}, {"i": 11, "a": "cup", "n": "ペット用食器スタンド", "m": 16.4, "s": 49, "x": 80}, {"i": 12, "a": "spoons", "n": "シリコン鍋つかみ", "m": 15.6, "s": 44, "x": 75}], MAX=10, ack5=false;
  function picked(){ var ids={}; document.querySelectorAll('tr input[data-pick]').forEach(function(b){ if(b.checked) ids[b.dataset.pick]=1; }); return D.filter(function(d){return ids[d.i];}); }
  function drawScatter(sel){
    var on={}; sel.forEach(function(d){on[d.i]=1;});
    var pts=D.map(function(d){ return {x:d.x,y:d.m,r:on[d.i]?8:6,hollow:!on[d.i],color:'primary',label:'#'+d.i,show:d.i<=2,tip:'<b>#'+d.i+' '+d.n+'</b><br>需求 '+d.x+' · 毛利 '+d.m.toFixed(1)+'% · 分数 '+d.s}; });
    $('#scatter').innerHTML=CP.chart.scatter({w:560,h:330,xmin:40,xmax:100,ymin:10,ymax:40,xlabel:'需求分 →',ylabel:'',yunit:'%',hlines:[{y:12,label:'毛利底线 12%',color:'block'}],zone:{x0:85,x1:100,y0:28,y1:37,label:'甜蜜区'},points:pts});
  }
  function update(){
    var sel=picked(), n=sel.length;
    $('#cnt').textContent=n;
    drawScatter(sel);
    $('#sel-n').textContent=n+' 个';
    $('#sel-th').innerHTML=sel.slice(0,6).map(function(d){return '<span class="thumb" data-art="'+d.a+'" data-tip="#'+d.i+' '+d.n+'"></span>';}).join('')+(n>6?'<span class="small faint" style="margin-left:6px">+'+(n-6)+'</span>':'');
    CP.hydrateArt($('#sel-th'));
    if(n){ var ms=sel.map(function(d){return d.m;}), avg=ms.reduce(function(a,b){return a+b;},0)/n, sc=sel.reduce(function(a,d){return a+d.s;},0)/n;
      $('#sel-avg').textContent=avg.toFixed(1)+'%'; $('#sel-rg').textContent='毛利区间 '+Math.min.apply(null,ms).toFixed(1)+'%–'+Math.max.apply(null,ms).toFixed(1)+'% · 均分 '+Math.round(sc); }
    else { $('#sel-avg').textContent='—'; $('#sel-rg').textContent='还没有勾选'; }
    var has5=sel.some(function(d){return d.i===5;});
    $('#warn5').hidden=!(has5&&!ack5);
    var block=!n||(has5&&!ack5), go=$('#go');
    go.disabled=block; go.classList.toggle('disabled',block);
    go.title=!n?'至少勾选 1 个':(has5&&!ack5?'有数据不全的行未确认':''); $('#go-hint').textContent=!n?'至少勾选 1 个':(has5&&!ack5?'有 1 行数据不全，确认后可发起':'');
  }
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.matches('input[data-pick]')){
      var id=t.dataset.pick, all=document.querySelectorAll('input[data-pick="'+id+'"]');
      if(t.checked && picked().filter(function(d){return d.i!=id;}).length>=MAX){ t.checked=false; CP.toast('单批最多勾选 '+MAX+' 个'); }
      all.forEach(function(b){ b.checked=t.checked; });
      if(id==='5' && t.checked && !ack5){ CP.toast('这一行数据不全：请在右栏展开确认'); }
      update();
    }
    if(t.id==='ack5'){ ack5=t.checked; update(); }
  });
  document.addEventListener('click',function(e){
    if(e.target.closest('.pk')) return;
    if(e.target.id==='more-btn'){ var hid=document.querySelector('tr.more[hidden]'); document.querySelectorAll('tr.more').forEach(function(r){ r.hidden=!hid; }); e.target.textContent=hid?'收起其余 4 个':'展开其余 4 个（分数 63 以下）'; }
    if(e.target.id==='go-nd'){ $('#tab-nd').click(); $('#tab-nd').scrollIntoView({block:'start',behavior:'smooth'}); }
    var a=$('#ack5'); if(a) a.checked=ack5;
    if(!e.target.closest('#impmenu')) $('#impmenu').open=false;
  });
  update();
  var r1=document.querySelector('tr[data-detail="d-1"]'); if(r1) r1.click();
})();
</script>

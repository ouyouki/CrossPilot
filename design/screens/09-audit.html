<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>审计 · CrossPilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/cp2.css">
<style>
/* —— 审计页专用 —— */
.filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.filters .field{margin:0;min-width:120px}
.filters .select{height:32px}
.actor{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font:600 13px var(--font-mono);flex:none}
.av.h{background:var(--primary);color:var(--on-primary)}
.av.a{background:var(--info-bg);color:var(--info)}
.av.s{background:var(--surface-3);color:var(--text-2)}
.av.c{background:var(--surface-3);color:var(--text-2);font-size:12px}
.who .k{font-size:13px;color:var(--text-3);display:block;line-height:1.2}
.tbl tr.rej td:first-child{box-shadow:inset 3px 0 0 transparent}
.tbl tr.rej{background:color-mix(in srgb,var(--block) 4%,transparent)}
.tbl tr.rej:hover{background:color-mix(in srgb,var(--block) 8%,transparent)}
.tbl tr.rej.sel{background:var(--primary-bg)}
.chain-mini{display:flex;align-items:center;gap:0;margin:14px 0 12px}
.chain-mini i{width:26px;height:26px;border-radius:7px;background:var(--ok-bg);display:block;position:relative}
.chain-mini i::after{content:"";position:absolute;inset:8px;border-radius:3px;background:var(--ok)}
.chain-mini b{width:14px;height:2px;background:var(--ok);display:block;opacity:.6}
.chain-mini i.anchor{background:var(--primary-bg)} .chain-mini i.anchor::after{background:var(--primary)}
.chain{display:flex;flex-direction:column;align-items:stretch;gap:0}
.blk{border-radius:12px;background:var(--surface-2);padding:10px 12px;font-size:14px;border:1px solid var(--border)}
.blk.cur{background:var(--primary-bg);border-color:transparent}
.blk .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.blk .t b{font:600 14px var(--font-mono)}
.blk .h{font:400 13px/1.55 var(--font-mono);color:var(--text-2);word-break:break-all}
.blk .h em{font-style:normal;color:var(--text-3)}
.link{height:22px;display:flex;align-items:center;padding-left:20px;font:500 12px var(--font-mono);color:var(--text-3);position:relative}
.link::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:2px;background:var(--ok)}
.code{font:400 14px/1.6 var(--font-mono);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:0;white-space:pre-wrap;word-break:break-all;color:var(--text-2)}
.diff{border-radius:10px;overflow:hidden;font:400 14px/1.6 var(--font-mono);border:1px solid var(--border)}
.diff div{padding:5px 10px;display:flex;gap:8px}
.diff .o{background:var(--surface-2);color:var(--text-3)} .diff .o span:last-child{text-decoration:line-through}
.diff .n{background:var(--primary-bg);color:var(--primary-strong)}
.diff .same{background:var(--surface-2);color:var(--text-2)}
.evs{display:flex;flex-wrap:wrap;gap:6px}
.evs .tag{font-size:13px}
.readonly{display:flex;gap:8px;align-items:center;margin-top:18px;padding:10px 12px;border-radius:10px;background:var(--surface-3);font-size:14px;color:var(--text-2)}
.readonly svg{width:15px;height:15px;flex:none}
.heatwrap{overflow-x:auto}
#audit-tbl td.mono{white-space:nowrap}
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.hstats div{background:var(--surface-2);border-radius:10px;padding:8px 12px}
.hstats b{display:block;font-size:18px}
</style>
</head>
<body data-page="audit" data-crumb="治理 / 审计">
<template id="main-tpl">
  <div class="page-head">
    <div>
      <span class="eyebrow">Audit · 只读</span>
      <h1>审计</h1>
      <p>系统的每个决定与人的每次回填都可查；平台侧实际写入以卖家后台为准。</p>
    </div>
    <div class="actions">
      <button class="help" data-toast="操作手册：审计页（演示）" aria-label="帮助">?</button>
      <button class="btn primary lg" data-toast="已导出脱敏文件，并写入一条审计记录（演示）">导出（脱敏，导出动作会写入审计）</button>
    </div>
  </div>

  <div class="g-main" style="margin-bottom:16px">
    <div class="card">
      <div class="card-head"><h2>活动热力图</h2><span class="meta">近 7 天 × 24 小时 · 每格 = 审计行数（含被拒绝）</span></div>
      <div class="heatwrap"><div class="chart" id="heat"></div></div>
      <p class="small faint" style="margin:10px 0 0">读法：03 时是夜间选品；10–12 时是素材生成；08–09 时与 18–20 时的浅格多是你本人的决定与回填。</p>
      <div class="hstats">
        <div><span class="small faint">最忙时段</span><b>03:00 · 夜间选品</b></div>
        <div><span class="small faint">人的决定与回填</span><b>34 次 / 7 天</b></div>
        <div><span class="small faint">夜间被拒绝</span><b style="color:var(--block)">1 次</b></div>
      </div>
    </div>
    <div class="stack">
      <div class="card">
        <div class="card-head"><h2>哈希链完整性</h2><span class="badge ok right">链完整</span></div>
        <div class="chain-mini" data-tip="每一行都带上一行的哈希；每日末锚定到库外">
          <i class="anchor"></i><b></b><i></i><b></b><i></i><b></b><i></i><b></b><i></i><b></b><i></i>
        </div>
        <dl class="kv">
          <dt>最近检查</dt><dd>10:45 · 逐行复算 18,442 → 18,531</dd>
          <dt>今日锚定点</dt><dd class="mono">seq 18,442</dd>
          <dt>锚定位置</dt><dd>库外只读副本（每日末）</dd>
          <dt>写入权限</dt><dd>应用只能追加，不能改删</dd>
        </dl>
      </div>
      <div class="card tint" style="padding:14px 18px">
        <div class="row between"><span class="small muted">近 7 天审计行</span><b style="font-size:22px">1,306</b></div>
        <div class="row between"><span class="small muted">其中被拒绝 / 被阻断</span><b style="color:var(--block)">12 / 6</b></div>
      </div>
    </div>
  </div>

  <div class="g2" style="margin-bottom:16px">
    <div class="card">
      <div class="card-head"><h2>决定分布</h2><span class="meta">近 7 天</span></div>
      <div class="chart" id="donut" data-chart="donut" data-cfg='{"size":140,"stroke":18,"label":"1,306","sub":"条决定","items":[{"label":"允许","value":1267,"text":"1,267","color":"ok"},{"label":"挂起","value":21,"text":"21","color":"wait"},{"label":"拒绝","value":12,"text":"12","color":"block"},{"label":"阻断","value":6,"text":"6","color":"block","tip":"阻断：6（命中规则，不进审批）"}]}'></div>
      <p class="small faint" style="margin:12px 0 0">读法：拒绝 = 越权或未登记的调用；阻断 = 命中规则，只能改后重来。两者都写审计，并且不随业务回滚。</p>
    </div>
    <div class="card">
      <div class="card-head"><h2>被拒绝与被阻断的原因</h2><span class="meta">近 7 天 · 共 18 次</span></div>
      <div class="chart" data-chart="hbars" data-cfg='{"lw":150,"color":"block","items":[{"label":"调用未登记的动作","value":4,"text":"4","tip":"未登记 = 拒绝并审计，不生成审批单"},{"label":"Agent 调用批准","value":3,"text":"3","tip":"Agent 没有批准权"},{"label":"Agent 调用人发起的动作","value":3,"text":"3","tip":"只有人能发起，返回 403"},{"label":"无授权图进入生成","value":3,"text":"3","tip":"G3-001"},{"label":"上架前品类复检","value":3,"text":"3","tip":"G0 再跑命中"},{"label":"生成预算超限","value":1,"text":"1","tip":"预算预留失败，转人放行"},{"label":"连接器访问未登记域名","value":1,"text":"1","tip":"出站域名白名单之外，拒绝并审计"}]}'></div>
      <p class="small faint" style="margin:12px 0 0">读法：前三项都是 Agent 越过自己权限的尝试，系统已拦下；可在下表用“被拒绝的尝试”单独看。</p>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px;padding:14px 18px">
    <div class="filters" id="filters">
      <div class="field"><label for="f-obj">对象</label><select class="select" id="f-obj"><option value="">全部</option><option value="prod">商品 / 素材集</option><option value="grant">授权</option><option value="rule">规则库 / 设置</option><option value="list">上架清单</option><option value="audit">审计</option><option value="data">数据连接</option></select></div>
      <div class="field"><label for="f-actor">人 / Agent</label><select class="select" id="f-actor"><option value="">全部</option><option value="h">人</option><option value="a">Agent</option><option value="s">系统</option><option value="c">系统·连接器</option></select></div>
      <div class="field"><label for="f-act">动作</label><select class="select" id="f-act"><option value="">全部</option><option value="approve">批准 / 代批</option><option value="gen">生成</option><option value="check">复核 / 检查</option><option value="fill">回填</option><option value="grant">授权相关</option><option value="fetch">自动取数</option><option value="other">其他</option></select></div>
      <div class="field"><label for="f-dec">结果</label><select class="select" id="f-dec"><option value="">全部</option><option value="allow">允许</option><option value="deny">拒绝</option><option value="hold">挂起</option><option value="block">阻断</option></select></div>
      <div class="field"><label for="f-time">时间</label><select class="select" id="f-time"><option value="7">近 7 天</option><option value="0">今天</option><option value="1">今天与昨天</option></select></div>
      <button class="chip" aria-pressed="false" id="f-rej" data-toast="筛选：被拒绝的尝试（演示）">被拒绝的尝试 <b style="color:var(--block)">8</b></button>
      <span class="faint small right" id="f-count">显示 21 / 21 条</span>
    </div>
  </div>

  <div class="card flush">
    <div class="card-head"><h2>审计记录</h2><span class="meta">点一行看详情 · 只读，无编辑与删除</span></div>

<script>
(function(){
  // 热力图（近 7 天 × 24 小时）
  var days=['10-14','10-15','10-16','10-17','10-18','10-19','10-20'], hrs=[], m=[];
  for(var h=0;h<24;h++) hrs.push((h<10?'0':'')+h);
  function base(h){ return h===3?38:h===2||h===4?12:(h>=10&&h<=12)?16:(h===8||h===9)?7:(h>=18&&h<=20)?5:(h>=13&&h<=17)?4:(h>=0&&h<=6)?1:2; }
  days.forEach(function(d,i){ var row=[]; for(var h=0;h<24;h++){ var v=base(h)+((i*7+h*3)%5)-2; if(i===6&&h>11) v=0; row.push(Math.max(0,v)); } m.push(row); });
  document.getElementById('heat').innerHTML=CP.chart.heat({rows:days,cols:hrs,matrix:m,cw:18,ch:18,lw:44,color:'primary',tip:function(r,c,v){return r+' '+c+':00–'+c+':59 · '+v+' 条';}});

  // 环形图：拒绝与阻断同为红色语义，阻断用浅一档区分
  var dn=document.querySelector('#donut svg'); if(dn){ var cs=dn.querySelectorAll('circle'); if(cs[4]) cs[4].setAttribute('stroke-opacity','.5'); var lg=document.querySelectorAll('#donut .legend i'); if(lg[3]) lg[3].style.opacity='.5'; }

  // 哈希链（演示用伪哈希）
  function hx(n){ var s='', x=(n*2654435761)>>>0; for(var i=0;i<16;i++){ x=(x*1103515245+12345)>>>0; s+=('0000'+(x>>>16).toString(16)).slice(-4); } return s; }
  function sh(n){ var s=hx(n); return s.slice(0,8)+'…'+s.slice(-6); }
  function fmt(n){ return n.toLocaleString('ja-JP'); }
  function blk(n,cur){ return '<div class="blk'+(cur?' cur':'')+'"><div class="t"><b>seq '+fmt(n)+'</b>'+(cur?'<span class="badge primary">本条</span>':'<span class="faint">'+(n===18442?'今日锚定点':'相邻行')+'</span>')+'</div><div class="h"><em>prev</em> '+sh(n-1)+'<br><em>hash</em> '+sh(n)+'</div></div>'; }
  function lnk(){ return '<div class="link">hash 写入下一行 prev · 一致 ✓</div>'; }
  function chain(root){ root.querySelectorAll('[data-chain]').forEach(function(el){ var n=+el.dataset.chain; el.innerHTML='<div class="chain">'+blk(n-1)+lnk()+blk(n,true)+lnk()+blk(n+1)+'</div><p class="small faint" style="margin:8px 0 0">复算 sha256(上一行 hash ‖ 本行内容) 与存储值一致；'+(n>18442?'今日锚定点之后。':'已包含在锚定点 seq 18,442 之前，已锚定到库外。')+'</p>'; }); }
  document.addEventListener('click',function(e){ if(e.target.closest('[data-detail]')) chain(document.getElementById('detail')); });

  // 筛选
  var tb=document.querySelectorAll('#audit-tbl tbody tr');
  function apply(){
    var g=function(id){ return document.getElementById(id).value; };
    var obj=g('f-obj'), actor=g('f-actor'), act=g('f-act'), dec=g('f-dec'), t=+g('f-time'), rej=document.getElementById('f-rej').getAttribute('aria-pressed')==='true', n=0;
    tb.forEach(function(r){ var d=r.dataset, ok=(!obj||d.obj===obj)&&(!actor||d.actor===actor)&&(!act||d.act===act)&&(!dec||d.dec===dec)&&(+d.day<=t)&&(!rej||d.dec==='deny'||d.dec==='block'); r.hidden=!ok; if(ok) n++; });
    document.getElementById('f-count').textContent='显示 '+n+' / '+tb.length+' 条';
  }
  document.getElementById('filters').addEventListener('change',apply);
  document.getElementById('f-rej').addEventListener('click',function(){ setTimeout(apply,0); });

  // 默认选中第一条被拒绝的尝试
  var first=document.querySelector('tr[data-detail="a-2"]'); if(first) first.click();
})();
</script>

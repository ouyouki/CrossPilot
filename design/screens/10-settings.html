<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设置 · CrossPilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/cp2.css">
<style>
/* —— 设置页专用 —— */
.set{display:grid;grid-template-columns:172px minmax(0,1fr);gap:18px;align-items:start}
.set > .tabs{flex-direction:column;border-bottom:0;gap:2px;position:sticky;top:76px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-1);padding:8px;margin:0}
.set > .tabs button{height:38px;text-align:left;border-bottom:0;border-radius:9px;margin:0;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:15px}
.set > .tabs button:hover{background:var(--surface-2)}
.set > .tabs button[aria-selected=true]{background:var(--primary-bg);border-bottom:0}
.set > .tabs .st{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.set > .tabs .st.wait{background:var(--wait-solid)} .set > .tabs .st.block{background:var(--block)}
.set > .tabs .grp{font:500 12px var(--font-mono);letter-spacing:.12em;color:var(--text-3);padding:10px 12px 4px}
.pendbar{background:var(--wait-bg);color:var(--wait);border-radius:14px;padding:12px 16px;margin-bottom:16px}
.pendbar[hidden]{display:none}
.pendbar .phd{display:flex;align-items:center;gap:10px}
.pendbar .phd b{font-size:16px}
.pendbar ul{list-style:none;margin:8px 0 0;padding:0}
.pendbar li{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--wait-solid) 30%,transparent);font-size:15px;color:var(--text)}
.pendbar li .meter{background:color-mix(in srgb,var(--wait-solid) 22%,transparent)}
.pendbar li .when{font-size:14px;color:var(--wait);white-space:nowrap}
.pendbar li.new{animation:flash 1.2s}
@keyframes flash{from{background:color-mix(in srgb,var(--wait-solid) 30%,transparent)}to{background:transparent}}
[data-pane=rate] .tbl td:first-child{min-width:120px}
[data-pane=rate] .tbl td:nth-child(4){min-width:96px;font-size:13px}
[data-pane=rate] .tbl td:nth-child(3){min-width:130px;font-size:14px;color:var(--text-2)}
[data-pane=rate] .tbl td,[data-pane=rate] .tbl th{padding-left:8px;padding-right:8px}
.tbl tr.miss td{background:var(--block-bg);color:var(--block)}
.tbl tr.miss td b{color:var(--block)}
.optcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border-strong);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:15px;background:var(--surface)}
.opt input{margin-top:4px;accent-color:var(--primary)}
.opt:has(input:checked){border-color:transparent;background:var(--primary-bg);box-shadow:0 0 0 2px var(--primary)}
.opt .s{display:block;font-size:14px;color:var(--text-3)}
.shot{width:54px;height:36px;border-radius:6px;flex:none;display:grid;place-items:center;font-size:12px;color:var(--text-3);background:repeating-linear-gradient(135deg,var(--surface-3) 0 6px,var(--surface-2) 6px 12px);box-shadow:inset 0 0 0 1px var(--border)}
.shop-item{display:flex;flex-direction:column;gap:6px}
.shop-item .top{display:flex;align-items:center;gap:8px}
.shop-item .top b{font-size:16px}
.shop-item .top .badge{margin-left:auto}
.dial{display:grid;grid-template-columns:minmax(0,1fr) 140px 84px 236px;gap:16px;align-items:center;padding:14px 20px;border-top:1px solid var(--border)}
.dial:first-of-type{border-top:0}
.dial .nm b{display:block;font-size:15px}
.dial .nm span{font-size:14px;color:var(--text-3)}
.dial .val{font-size:22px;font-weight:600;text-align:right;letter-spacing:-.01em}
.dial .val small{font-size:14px;color:var(--text-3);font-weight:400}
.dtrack{position:relative;height:8px;border-radius:4px;background:var(--surface-3)}
.dtrack i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:color-mix(in srgb,var(--primary) 35%,transparent)}
.dtrack b{position:absolute;top:-5px;width:4px;height:18px;margin-left:-2px;border-radius:2px;background:var(--primary)}
.dtrack .pend{background:var(--wait-solid);opacity:.9}
.dends{display:flex;justify-content:space-between;font-size:13px;color:var(--text-3);margin-top:6px}
.dial .btns{display:flex;gap:6px;justify-content:flex-end}
.dial.fixed{background:var(--surface-2)}
.agent{display:flex;flex-direction:column;gap:10px}
.agent .hd{display:flex;align-items:center;gap:10px}
.agent .avt{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:600 19px var(--font-mono);background:var(--info-bg);color:var(--info);flex:none}
.agent .hd b{font-size:17px;display:block;line-height:1.2}
.agent .hd span{font-size:14px;color:var(--text-3);white-space:nowrap}
.agent .seg{width:100%}
.agent .seg button{flex:1;padding:0 6px}
.agent .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-size:13px;color:var(--text-3)}
.agent .nums b{display:block;font-size:17px;color:var(--text)}
.agent.off .avt{background:var(--surface-3);color:var(--text-3)}
.layer{display:grid;grid-template-columns:34px minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:14px;margin-bottom:9px}
.layer .bar{display:flex;gap:2px;height:12px}
.layer .bar i{display:block;height:100%;border-radius:3px}
.fresh{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--surface-2)}
.fresh .badge{justify-self:start}
.fresh.cur{background:var(--ok-bg)}
.fresh.ghost{opacity:.55}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.role{border-radius:14px;background:var(--surface-2);padding:16px}
.role .ava{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);font-weight:600;font-size:19px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{display:flex;gap:10px;font-size:15px;align-items:flex-start}
.checks li i{width:18px;height:18px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:600;flex:none;margin-top:2px}
/* —— 数据连接 —— */
.set > .tabs .st.off{background:var(--text-3);opacity:.6}
.how{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:13px;font-weight:500;white-space:nowrap;background:var(--surface-3);color:var(--text-2)}
.how.auto{background:var(--info-bg);color:var(--info)}
.how.man{background:transparent;box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--text-3)}
.how + .sub{white-space:normal;margin-top:3px}
.conns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.conns .conn{padding:18px}
.conn{display:flex;flex-direction:column;gap:10px}
.conn .hd{display:flex;align-items:flex-start;gap:10px}
.conn .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--primary-bg);color:var(--primary-strong);flex:none}
.conn .ico svg{width:20px;height:20px}
.conn.off .ico{background:var(--surface-3);color:var(--text-3)}
.conn .hd b{display:block;font-size:16px;line-height:1.3}
.conn .src{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-3);margin-top:3px}
.conn .src{align-items:flex-start;line-height:1.45}
.conn .src .grade{width:20px;height:20px;font-size:12px;flex:none}
.conn .hd .switch{margin-left:auto;margin-top:4px}
.conn .mid{display:grid;grid-template-columns:1fr;gap:8px;justify-items:center}
.conn .mid .kv{justify-self:stretch}
.conn .mid .chart svg{display:block}
.conn .mid .unk{width:128px}
@media (max-width:1100px){.conns{grid-template-columns:1fr}}
.conn .kv{font-size:14px;gap:3px 10px}
.conn .fail{margin:0;font-size:13px;color:var(--text-2);background:var(--surface-2);border-radius:9px;padding:7px 10px}
.conn .fail b{font-weight:600;color:var(--text)}
.conn .unk{height:78px;display:grid;place-items:center;border-radius:12px;background:var(--surface-2);text-align:center;font-size:13px;color:var(--text-3)}
.conn .unk b{display:block;font-size:20px;color:var(--text-2)}
.conn .foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.fxbig{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fxbig .v{font-size:46px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.fxbig .u{font-size:16px;color:var(--text-3)}
.formula{font:400 13px/1.6 var(--font-mono);color:var(--text-3);background:var(--surface-2);border-radius:8px;padding:6px 10px;margin:8px 0 0}
.tbl tr.hold td{background:var(--wait-bg)}
.tbl tr.hold td .why{display:block;font-size:13px;color:var(--wait);margin-top:2px;white-space:normal}
.tbl tr.hold td.acts{white-space:nowrap}
[data-pane=fx] .tbl td:not([colspan]){white-space:nowrap}
[data-pane=fx] .tbl td,[data-pane=fx] .tbl th{padding-left:9px;padding-right:9px}
.ovr > summary{font-size:15px}
.ovr .body .row{margin-top:4px}
@media (max-width:1280px){.set{grid-template-columns:1fr}.set > .tabs{position:static;flex-direction:row;flex-wrap:wrap}.dial{grid-template-columns:1fr 1fr}}
</style>
</head>
<body data-page="settings" data-crumb="设置">
<template id="main-tpl">
  <div class="page-head">
    <div>
      <span class="eyebrow">Settings · JP-01</span>
      <h1>设置</h1>
      <p>往严立即生效；往松须申请，24 小时后生效。</p>
    </div>
    <div class="actions">
      <button class="help" data-toast="操作手册：设置页（演示）" aria-label="帮助">?</button>
      <button class="btn primary lg" data-toast="已保存当前分区的收紧项，立即生效（演示）">保存</button>
    </div>
  </div>

  <div class="pendbar" id="pending">
    <div class="phd"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><b>待生效项 <span id="pend-n">1</span></b><span class="small">放宽要等 24 小时；期间随时可撤回。到点前一切照旧。</span></div>
    <ul id="pending-list">
      <li><span>每日上架清单上限 10 → 12</span><span class="meter wait" data-tip="已等待 1 小时 35 分 / 24 小时"><i style="width:7%"></i></span><span class="when">2026-10-21 09:30 生效</span><button class="btn sm" data-withdraw data-toast="已撤回该申请（演示）">撤回</button></li>
    </ul>
  </div>

  <div class="set" data-tabs>
    <div class="tabs" role="tablist" aria-label="设置分区" aria-orientation="vertical">
      <span class="grp">数据连接</span>
      <button role="tab" data-tab="conn" aria-selected="true">连接器总览<span class="st wait" title="1 项待你确认"></span></button>
      <button role="tab" data-tab="fx" aria-selected="false">汇率（自动）<span class="st wait" title="汇率突变待确认"></span></button>
      <button role="tab" data-tab="tariff" aria-selected="false">关税率与节假日<span class="st"></span></button>
      <button role="tab" data-tab="freight" aria-selected="false">国际运费报价<span class="st"></span></button>
      <button role="tab" data-tab="rank" aria-selected="false">榜单与竞品<span class="st off" title="未配置"></span></button>
      <button role="tab" data-tab="src" aria-selected="false">货源采集<span class="st"></span></button>
      <button role="tab" data-tab="feewatch" aria-selected="false">费率页变更提醒<span class="st"></span></button>
      <span class="grp">成本</span>
      <button role="tab" data-tab="rate" aria-selected="false">费率卡<span class="st block" title="1 项缺失"></span></button>
      <span class="grp">准入</span>
      <button role="tab" data-tab="cat" aria-selected="false">品类白名单<span class="st"></span></button>
      <button role="tab" data-tab="shop" aria-selected="false">店铺档案<span class="st wait" title="1 项未确认"></span></button>
      <button role="tab" data-tab="rules" aria-selected="false">规则库<span class="st"></span></button>
      <span class="grp">护栏</span>
      <button role="tab" data-tab="belt" aria-selected="false">安全带<span class="st wait" title="1 项待生效"></span></button>
      <button role="tab" data-tab="agent" aria-selected="false">Agent<span class="st"></span></button>
      <button role="tab" data-tab="budget" aria-selected="false">模型与预算<span class="st"></span></button>
      <button role="tab" data-tab="member" aria-selected="false">成员<span class="st wait" title="单人运行"></span></button>
    </div>

    <div style="min-width:0">
      <!-- ============ 费率卡 ============ -->
      <div data-pane="rate" hidden class="stack">
        <div class="g2">
          <div class="card">
            <div class="card-head"><h2>费率卡 v12 完整度</h2><span class="meta">18 个值</span></div>
            <div class="row" style="gap:18px">
              <div class="chart" data-chart="ring" data-cfg='{"pct":94.4,"size":112,"stroke":11,"label":"17/18","sub":"已填","color":"wait","fs":20,"tip":"缺 1 项 BLOCKING：c3 国际运费 1–2kg 档"}'></div>
              <div class="stack sm small">
                <div class="row"><span class="badge ok">CONFIRMED 9</span></div>
                <div class="row"><span class="badge wait">ESTIMATED 8</span></div>
                <div class="row"><span class="badge block">MISSING 1</span><span class="faint">BLOCKING</span></div>
              </div>
            </div>
            <p class="small faint" style="margin:12px 0 0">缺失项不会用默认值补；估算项可用于选品排序，但同意 2 前必须换成确认值。</p>
          </div>
          <div class="card">
            <div class="card-head"><h2>成本结构 · 候选 #1</h2><span class="meta" lang="ja">折叠収納ボックス3個セット · ¥2,480</span></div>
            <div class="chart" data-chart="donut" data-cfg='{"size":124,"stroke":18,"label":"31.7%","sub":"毛利","fs":18,"items":[{"label":"到岸成本 c1–c7","value":1303,"text":"¥1,303","color":"s1"},{"label":"佣金手续费 c8–c9","value":322,"text":"¥322","color":"s4"},{"label":"退货损耗 c10","value":70,"text":"¥70","color":"s2"},{"label":"利润","value":785,"text":"¥785","color":"s3"}]}'></div>
            <p class="small faint" style="margin:10px 0 0">读法：到岸成本占售价一半以上，c3 国际运费是其中最大的变量。</p>
          </div>
        </div>

        <div class="alert block"><span><b>1 项 BLOCKING 缺失：c3 国际运费 1–2kg 档未录入。</b>用到该档的 3 个候选已进“数据待补”，不显示毛利与分数。</span><button class="btn sm right" data-toast="定位到 c3 · 1–2kg 档并打开录入（演示）">去补</button></div>

        <div class="card flush">
          <div class="card-head"><h2>成本项 c1–c16</h2><span class="meta">示例值 = 候选 #1 的单件成本</span><div class="tools"><button class="btn sm" data-toast="录入 c3 · 1–2kg 档（演示）">录入缺失项</button></div></div>
          <div class="tblwrap"><table class="tbl dense">
            <thead><tr><th>项</th><th class="num">值</th><th>来源 · 取数日期</th><th>来源方式</th><th>状态</th><th>缺失级别</th></tr></thead>
            <tbody>
              <tr><td>c1 采购价</td><td class="num">¥666<span class="sub">32 CNY × 20.8</span></td><td>货源导出文件 × 汇率<span class="sub mono">10-18</span></td><td><span class="how">半自动</span><span class="sub">汇率 <span class="how auto">自动</span></span></td><td><span class="badge ok">CONFIRMED</span></td><td class="small">BLOCKING</td></tr>
              <tr><td>c2 国内段运费</td><td class="num">¥62</td><td>供应商报价截图<span class="sub mono">10-18</span></td><td><span class="how man">手工</span></td><td><span class="badge ok">CONFIRMED</span></td><td class="small">BLOCKING</td></tr>
              <tr><td>c3 国际运费 · 0–0.5kg</td><td class="num">¥380</td><td>国际物流报价表 v3<span class="sub mono">10-15</span></td><td><span class="how">半自动</span><span class="sub">报价表导入 · 有效期至 12-31</span></td><td><span class="badge ok">CONFIRMED</span></td><td class="small">BLOCKING</td></tr>
              <tr><td>c3 国际运费 · 0.5–1kg</td><td class="num">¥520</td><td>国际物流报价表 v3<span class="sub mono">10-15</span></td><td><span class="how">半自动</span><span class="sub">报价表导入 · 有效期至 12-31</span></td><td><span class="badge ok">CONFIRMED</span></td><td class="small">BLOCKING</td></tr>
              <tr class="miss"><td><b>c3 国际运费 · 1–2kg</b><span class="sub" style="color:var(--block)">影响 3 个候选</span></td><td class="num"><b>未录入</b></td><td>报价表 v3 未含此档<span class="sub mono">—</span></td><td><span class="how">半自动</span><span class="sub" style="color:var(--block)">报价表导入 · 缺此档</span></td><td><span class="badge block">MISSING</span></td><td><span class="badge block">BLOCKING</span></td></tr>
              <tr><td>c4 关税</td><td class="num">¥0</td><td>由税口径决定（演示假设，需税理士确认）<span class="sub mono">10-12</span></td><td><span class="how">半自动</span><span class="sub">官方税率表 · 季度</span></td><td><span class="badge wait">ESTIMATED</span></td><td class="small">BLOCKING</td></tr>
              <tr><td>c5 输入消费税</td><td class="num">¥0</td><td>由税口径决定（演示假设，需税理士确认）<span class="sub mono">10-12</span></td><td><span class="how man">手工</span><span class="sub">配置 · 带生效日</span></td><td><span class="badge wait">ESTIMATED</span></td><td class="small">BLOCKING</td></tr>
              <tr><td>c6 通関费</td><td class="num">¥30</td><td>通关代理报价<span class="sub mono">10-15</span></td><td><span class="how man">手工</span></td><td><span class="badge ok">CONFIRMED</span></td><td class="small">BLOCKING</td></tr>
              <tr><td>c7 包材</td><td class="num">¥25</td><td>包材采购单<span class="sub mono">10-14</span></td><td><span class="how man">手工</span></td><td><span class="badge ok">CONFIRMED</span></td><td class="small">BLOCKING</td></tr>
              <tr><td>c8 平台佣金</td><td class="num">¥248<span class="sub">10%</span></td><td>平台费率页（原文待复核）<span class="sub mono">10-19</span></td><td><span class="how man">手工</span><span class="sub">变化提醒</span></td><td><span class="badge wait">ESTIMATED</span></td><td class="small">BLOCKING</td></tr>
              <tr><td>c9 支付 / 跨境履约手续费</td><td class="num">¥74<span class="sub">3%</span></td><td>平台费率页（原文待复核）<span class="sub mono">10-19</span></td><td><span class="how man">手工</span><span class="sub">变化提醒</span></td><td><span class="badge wait">ESTIMATED</span></td><td class="small">BLOCKING</td></tr>
              <tr><td>c10 退货损耗（期望值）</td><td class="num">¥70</td><td>退货率 2.6% · 退运费 ¥545（你填写）<span class="sub mono">10-12</span></td><td><span class="how man">手工</span></td><td><span class="badge wait">ESTIMATED</span></td><td class="small">BLOCKING</td></tr>
              <tr><td>c11 达人佣金</td><td class="num">¥0</td><td>已确认为零<span class="sub mono">10-12</span></td><td><span class="how man">手工</span></td><td><span class="badge ok">CONFIRMED</span></td><td class="small faint">可为零</td></tr>

<script>
(function(){
  var list=document.getElementById('pending-list'), bar=document.getElementById('pending'), cnt=document.getElementById('pend-n');
  // 支持 10-settings.html#belt 这类直达链接
  var h=location.hash.slice(1); if(h){ var t=document.querySelector('.set [role=tab][data-tab="'+h+'"]'); if(t) t.click(); }
  function count(){ var n=list.children.length; cnt.textContent=n; bar.hidden=n===0; }
  function pad(n){ return (n<10?'0':'')+n; }
  function addPending(text){
    var now=new Date(), at='2026-10-21 '+pad(now.getHours())+':'+pad(now.getMinutes());
    var li=document.createElement('li'); li.className='new';
    var s=document.createElement('span'); s.textContent=text; li.appendChild(s);
    li.insertAdjacentHTML('beforeend','<span class="meter wait" data-tip="刚刚申请 · 0 / 24 小时"><i style="width:2%"></i></span><span class="when">'+at+' 生效</span><button class="btn sm" data-withdraw data-toast="已撤回该申请（演示）">撤回</button>');
    list.appendChild(li); count();
    bar.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-loosen]');
    if(b && !b.disabled){ addPending(b.dataset.loosen); b.disabled=true; b.textContent='已申请，待生效'; return; }
    var w=e.target.closest('[data-withdraw]'); if(w){ w.closest('li').remove(); count(); return; }
    // 数据连接：跳到对应分区
    var go=e.target.closest('[data-goto]');
    if(go){ var tb=document.querySelector('.set [role=tab][data-tab="'+go.dataset.goto+'"]'); if(tb){ tb.click(); document.getElementById('main').scrollTo({top:0}); window.scrollTo({top:0}); } return; }
    // 连接器开关：关闭即时；开启 = 放宽，走 24 小时（cp2.js 已先切换 aria-checked）
    var sw=e.target.closest('[data-conn-sw]');
    if(sw){
      var card=sw.closest('[data-conn]'), nm=card.dataset.conn, nowOn=sw.getAttribute('aria-checked')==='true';
      if(sw.hasAttribute('data-unset')){ sw.setAttribute('aria-checked','false'); CP.toast(nm+'：未配置，先选择接入方式再申请开启（演示）'); return; }
      if(nowOn){ sw.setAttribute('aria-checked','false');
        if(sw.dataset.pending){ CP.toast(nm+'：已有开启申请待生效（演示）'); return; }
        sw.dataset.pending='1'; addPending('开启连接器：'+nm); CP.toast('开启是放宽：'+nm+' 将于 24 小时后开启（演示）'); }
      else { card.classList.add('off'); CP.toast(nm+' 已关闭，立即生效；依赖它的数据到期后显示“已过期”（演示）'); }
      return;
    }
    // Agent 状态：往严即时，往松走 24 小时
    var a=e.target.closest('[data-agent] .seg button');
    if(a){
      var seg=a.parentElement, cur=+seg.dataset.lv, l=+a.dataset.l, name=seg.closest('[data-agent]').querySelector('.hd b').textContent;
      var label={2:'ACTIVE',1:'仅建议',0:'关闭'};
      if(l===cur) return;
      if(l<cur){ seg.dataset.lv=l; seg.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed',x===a); }); seg.closest('[data-agent]').classList.toggle('off',l===0); CP.toast(name+' 已切为'+label[l]+'，立即生效（演示）'); }
      else { addPending(name+'：'+label[cur]+' → '+label[l]); CP.toast('往松切须申请：'+name+' 将于 24 小时后切为'+label[l]+'（演示）'); }
    }
  });
})();
</script>

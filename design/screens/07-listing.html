<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>上架 · CrossPilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/cp2.css">
<style>
/* ===== 上架页专用 ===== */
.sec{margin-bottom:16px}
.lhead{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center}
.lhead h2{font-size:20px}
.lhead .meta{font-size:14px;color:var(--text-3);margin-top:2px}
.cring{display:flex;align-items:center;gap:12px}
.cring svg{width:68px;height:68px;display:block}
.cring .bg{stroke:var(--surface-3)} .cring .fg{stroke:var(--primary);transition:stroke-dasharray .25s}
.cring.full .fg{stroke:var(--ok)}
.cring text{font:600 17px var(--font-latin);fill:var(--text)}
.cring .lab{font-size:14px;color:var(--text-3);line-height:1.5}
.cring .lab b{display:block;font-size:15px;color:var(--text)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 284px;gap:16px;align-items:start}

.fl{width:100%;border-collapse:collapse;font-size:12.5px}
.fl td{padding:9px 10px;border-top:1px solid var(--border);vertical-align:top}
.fl tr:first-child td{border-top:0}
.fl td.k{width:118px;color:var(--text-2);white-space:nowrap}
.fl td.k .n{font:500 12px var(--font-mono);color:var(--text-3);margin-right:6px}
.fl td.v{line-height:1.6;white-space:pre-line}
.fl td.c{width:76px;text-align:right}
.fl tr.done{background:color-mix(in srgb,var(--ok-bg) 60%,transparent)}
.fl tr.done td.k{color:var(--ok)}
.fl tr.done .btn{border-color:transparent;background:var(--ok-bg);color:var(--ok)}
.fl .ref{font-size:14px;color:var(--text-3)}

.phone{width:252px}
.phone .gal{position:relative}
.phone .gal .ph{border-radius:0}
.phone .cnt{position:absolute;right:8px;top:8px;font-size:12px;background:rgba(0,0,0,.45);color:#fff;border-radius:8px;padding:0 6px}
.phone .p-price{display:flex;align-items:baseline;gap:2px}
.phone .p-row b{color:#111;font-weight:600}
.phone .p-cta{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 12px 12px}
.phone .p-cta span{height:30px;border-radius:15px;display:grid;place-items:center;font-size:13px;font-weight:600}
.phone .p-cta span:first-child{background:#FFE5E8;color:#E8233B} .phone .p-cta span:last-child{background:#E8233B;color:#fff}
.ph .af{position:absolute;inset:0;display:block}
.wall{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.wall .ph{border-radius:7px}
.wall .ph.v{aspect-ratio:1/1;background:var(--ink)}
.wall .ph.v::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-40%,-50%);border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.files{font:500 10.5px var(--font-mono);color:var(--text-3);line-height:1.7;margin-top:8px;max-height:72px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}

.bf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 12px}
.bf .field{margin-bottom:12px}
.bf .wide{grid-column:span 2}
.drop{height:34px;border:1px dashed var(--border-strong);border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:var(--text-3);cursor:pointer;background:var(--surface-2)}

.verdict{display:flex;align-items:center;gap:16px;border-radius:16px;padding:16px 18px;margin-bottom:14px}
.verdict .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:600;flex:none}
.verdict b{font-size:22px;letter-spacing:-.01em;display:block}
.verdict span.s{font-size:12.5px}
.verdict.ok{background:var(--ok-bg);color:var(--ok)} .verdict.ok .ic{background:var(--ok);color:var(--surface)}
.verdict.bad{background:var(--block-bg);color:var(--block)} .verdict.bad .ic{background:var(--block);color:var(--surface)}
.verdict.wait{background:var(--wait-bg);color:var(--wait)} .verdict.wait .ic{background:var(--wait-solid);color:#2B1D00}
.verdict .right{text-align:right}

.rb{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--border)}
.rb th{font-size:13px;font-weight:600;letter-spacing:.06em;text-align:left;color:var(--text-3);padding:8px 12px;background:var(--surface-2)}
.rb td{padding:9px 12px;border-top:1px solid var(--border);vertical-align:middle}
.rb td.k{color:var(--text-2);white-space:nowrap;width:130px}
.rb td.k i{font-style:normal;font:500 12px var(--font-mono);color:var(--text-3);margin-left:4px}
.rb td.r{width:92px;text-align:right}
.rb tr.x td{background:var(--block-bg)}
.rb tr.x td.act{color:var(--block);font-weight:600}
.rb tr.s td{background:var(--wait-bg)}
.rb tr.s td.act{color:var(--wait);font-weight:600}
.rb .mini{display:flex;gap:6px;align-items:center}
.rb .mini .thumb{width:34px;height:34px;border-radius:8px}

.confirm{display:flex;flex-direction:column;gap:10px}
.confirm .row .input{width:110px}
.review{display:flex;gap:8px;flex-wrap:wrap}
.review label{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;background:var(--surface-2);cursor:pointer;font-size:15px;box-shadow:0 0 0 1px var(--border)}
.review label:has(input:checked){background:var(--primary-bg);box-shadow:0 0 0 2px var(--primary);color:var(--primary-strong);font-weight:600}
.review input{accent-color:var(--primary)}

.stale{background:var(--block-bg);border-radius:16px;padding:16px 18px}
.stale h3{color:var(--block);font-size:16px}
.stale .vb{display:grid;grid-template-columns:90px minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:14px;margin-top:8px}
.stale .tr{position:relative;height:12px;background:var(--surface);border-radius:4px}
.stale .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.stale .tr .tol{position:absolute;top:-5px;bottom:-5px;border-left:2px dashed var(--block)}

.dead{background:var(--block-bg);border-radius:18px;padding:20px;color:var(--text)}
.dead .big{display:flex;align-items:center;gap:14px}
.dead .big .ic{width:52px;height:52px;border-radius:14px;background:var(--block);color:var(--surface);display:grid;place-items:center;font-size:28px;font-weight:600}
.dead .big b{font-size:22px;color:var(--block);display:block}
.dead .inner{background:var(--surface);border-radius:14px;padding:6px 14px;margin-top:14px;opacity:.75}
.dead .inner .fl td{color:var(--text-3);text-decoration:line-through}
.dead .inner .fl td.k{text-decoration:none}
.dead .skus{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.dead .sku{background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14px}
.dead .sku.hit{box-shadow:0 0 0 2px var(--block)}
.foot-note{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:14px;color:var(--text-3);background:var(--surface-2);border-radius:12px;padding:10px 14px;position:sticky;bottom:12px;z-index:5;box-shadow:var(--shadow-1)}

/* 通道对比条 */
.chs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ch{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-1);padding:11px 14px;min-width:0}
.ch b{font-size:14px;font-weight:600;white-space:nowrap}
.ch .row{flex-wrap:wrap;gap:4px 6px}
.ch .badge{height:22px;font-size:12.5px;padding:0 8px}
.ch .tm{font:600 22px var(--font-latin);margin:4px 0 2px;letter-spacing:-.01em}
.ch .tm small{font-size:13px;font-weight:400;color:var(--text-3);margin-left:2px}
.ch .s{font-size:13px;color:var(--text-3);line-height:1.4}
.ch.on{background:var(--primary-bg);box-shadow:0 0 0 2px var(--primary)}
.ch.on .tm{color:var(--primary-strong)}
.ch.off{background:var(--surface-2);box-shadow:none;color:var(--text-3)}
.ch.off .tm{color:var(--text-3)}

/* 批量上架包 */
.bgrid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;align-items:start}
.grp{background:var(--surface-2);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.grp .gh{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;font-size:13px;font-weight:600;color:var(--text-2);margin:0 2px 6px}
.bi,.xi{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;align-items:center;background:var(--surface);border-radius:10px;padding:7px 8px;margin-top:6px}
.bi .thumb{width:36px;height:36px;border-radius:9px}
.bi b,.xi b{display:block;font-size:13.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bi .mono{display:block;font-size:12px;color:var(--text-2)}
.bi .s,.xi .s{display:block;font-size:12px;color:var(--text-3)}
.bi .badge,.xi .badge{height:20px;font-size:12px;padding:0 7px;margin-top:3px}
.xi > .badge{grid-column:2;justify-self:start;margin-top:0}
.bi .mono{white-space:nowrap}
.xi{background:var(--block-bg);margin-top:0}
.xi .thumb{filter:grayscale(1);opacity:.7}
.xi .s{color:var(--block)}
.sc1 .card-head h2{display:flex;align-items:center;gap:8px}
.sc1 .no{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font:600 13px var(--font-mono);background:var(--primary-bg);color:var(--primary-strong)}
.sc1.now{box-shadow:0 0 0 2px var(--primary),var(--shadow-2)}
.sc1.now .no{background:var(--primary);color:var(--on-primary)}
.chk3{display:grid;gap:6px}
.chk3 > div{display:grid;grid-template-columns:20px 74px minmax(0,1fr);gap:8px;align-items:baseline;font-size:14px}
.chk3 .ok{color:var(--ok);font-weight:600}
.chk3 .s{color:var(--text-3);font-size:13px}
.path{background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:14px}
.path b{color:var(--primary-strong)}
.dl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sc1 .seg button{white-space:nowrap}
.sc1 .row{flex-wrap:wrap}
.mbox{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:10px}
.fail{background:var(--block-bg);border-radius:12px;padding:10px 12px;margin-top:8px}
.fail .fh{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:6px}
.fail .fh b{display:block;font-size:14px}
.fail .fh .mono{font-size:12px;color:var(--text-2)}
.fr2{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;font-size:13.5px;padding:3px 0;line-height:1.5}
.fr2 .k{color:var(--text-3)}
.bigdrop{border:1.5px dashed var(--border-strong);border-radius:12px;background:var(--surface-2);padding:14px;text-align:center;cursor:pointer}
.bigdrop b{display:block;font-size:14.5px;color:var(--primary-strong)}
.bigdrop span{font-size:13px;color:var(--text-3)}
.mx{width:100%;border-collapse:collapse;font-size:12.5px}
.mx th{font-size:12px;font-weight:600;color:var(--text-3);text-align:center;padding:6px 3px;background:var(--surface-2);white-space:nowrap}
.mx th:first-child{text-align:left;padding-left:8px}
.mx td{border-top:1px solid var(--border);padding:6px 3px;text-align:center}
.mx td:first-child{text-align:left;white-space:nowrap;padding-left:8px}
.mx td:first-child .thumb{width:24px;height:24px;border-radius:6px;vertical-align:middle;margin-right:6px}
.mx td:first-child .mono{font-size:11.5px;color:var(--text-2);display:inline}
.mx tr.na td{color:var(--text-3);font-size:12.5px}
.mx tr.na td[colspan]{text-align:left}
i.y,i.n,i.u{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:600}
i.y{background:var(--ok-bg);color:var(--ok)} i.n{background:var(--block-bg);color:var(--block)} i.u{background:var(--wait-bg);color:var(--wait)}
.legend span{display:inline-flex;align-items:center;gap:4px;margin-right:12px}
details.fb{margin-top:10px}
details.fb > summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--text-2);display:flex;gap:10px;align-items:center}
.rvl{display:grid;gap:6px}
.rvl > div{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:10px;padding:6px 10px;font-size:13.5px}
.rvl .thumb{width:26px;height:26px;border-radius:7px}
.rvl b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rvl .badge{height:22px;font-size:12.5px;flex:none}
.rvl .na{color:var(--text-3)}
@media (max-width:1400px){.bgrid{grid-template-columns:1fr}.chs{grid-template-columns:repeat(2,minmax(0,1fr))}}
[hidden]{display:none!important}
</style>
</head>
<body data-page="listing" data-crumb="流水线 / 上架">
<template id="main-tpl">
  <div class="page-head">
    <div>
      <span class="eyebrow">LISTING · 批次 B-1020-01 · 2026-10-20</span>
      <h1>上架：本批 4 个品已打包，2 个上传失败待修正</h1>
      <p>4 个品各自已过同意 2，系统只把它们打成一个上传包。你在卖家后台一次上传，失败与读回由系统解析</p>
    </div>
    <div class="actions">
      <button class="help" data-toast="操作手册：上架页（演示）" aria-label="帮助">?</button>
      <button class="btn" id="copyAll" data-toast="已切到逐项照做（兜底）：已复制全部字段，正在打开卖家后台（演示）">逐项照做（兜底）</button>
      <button class="btn primary lg" data-toast="下载 B-1020-01 上架包：3 个类目模板 + 素材包（演示）">下载本批上架包</button>
    </div>
  </div>

  <div class="alert wait sec"><span><b>提醒</b>　本期无写接口：请在卖家后台照清单操作，并回填后台实际值；平台侧是否写入以卖家后台为准。批量上传是官方功能，由你手动上传，系统不操作卖家后台。</span></div>

  <div class="chs sec" role="list" aria-label="上架通道">
    <div class="ch" role="listitem"><div class="row between"><b>A1 逐项照做</b><span class="badge">兜底</span></div><div class="tm">≈19′<small>/品</small></div><div class="s">复制字段，在后台逐个新建，再回填</div></div>
    <div class="ch on" role="listitem" aria-current="true"><div class="row between"><b>A2 批量上架包</b><span class="badge primary">推荐 · 当前</span></div><div class="tm">≈2.8′<small>/品</small></div><div class="s">一次上传模板，失败与读回自动解析</div></div>
    <div class="ch off" role="listitem"><div class="row between"><b>B 写接口直传</b><span class="badge">未启用</span></div><div class="tm">0′<small>/品</small></div><div class="s">U-1/U-2 答复后启用</div></div>
    <div class="ch off" role="listitem"><div class="row between"><b>C 授权 ERP 通道</b><span class="badge">未启用</span></div><div class="tm">≈1′<small>/品</small></div><div class="s">服务商支持与条款待核实（U-20）</div></div>
  </div>

  <div data-tabs>
    <div class="tabs" role="tablist" aria-label="上架状态">
      <button role="tab" data-tab="batch" aria-selected="true">批量上架包<span class="n">4</span></button>
      <button role="tab" data-tab="todo" aria-selected="false">待执行<span class="n">1</span></button>
      <button role="tab" data-tab="ok" aria-selected="false">读回一致<span class="n">1</span></button>
      <button role="tab" data-tab="bad" aria-selected="false">关键字段不一致<span class="n">1</span></button>
      <button role="tab" data-tab="soft" aria-selected="false">非关键差异<span class="n">1</span></button>
      <button role="tab" data-tab="dead" aria-selected="false">整张不可执行<span class="n">1</span></button>
    </div>

    <!-- ===================== 批量上架包 ===================== -->
    <div data-pane="batch">
      <div class="steps sec">
            <div class="st done"><i>1</i>生成</div>
            <div class="st done"><i>2</i>一次上传</div>
            <div class="st now"><i>3</i>失败回收</div>
            <div class="st"><i>4</i>自动读回</div>
            <div class="st"><i>5</i>审核状态</div>
          </div>
      <div class="bgrid sec">
        <!-- 左：批次构成 -->
        <div class="card">
          <div class="card-head"><h2>批次构成</h2><span class="meta">4 个品 · 3 个类目模板</span></div>
          <p class="small faint" style="margin:0 0 10px">只收已过同意 2 的品，每个品一张审批单。批次只是执行打包，不是批量批准；未批准的品不进批次，清单与素材包不可下载。</p>
          <div class="grp">
            <div class="gh"><span lang="ja">キッチンツール &gt; 調理スプーン・ヘラ</span><span class="tag">模板 v3</span></div>
            <div class="bi"><span class="thumb" data-art="spoons"></span><div><b lang="ja">シリコン調理スプーン5点セット</b><span class="mono">CP-0002-3f9a1c07</span><span class="s">同意 2 · 10-20 10:05 · 已批准</span><span class="badge ok">已上传</span></div></div>
          </div>
          <div class="grp">
            <div class="gh"><span lang="ja">収納用品 &gt; 引き出し収納</span><span class="tag">模板 v2</span></div>
            <div class="bi"><span class="thumb" data-art="divider"></span><div><b lang="ja">引き出し仕切り板</b><span class="mono">CP-0007-a47d2b10</span><span class="s">同意 2 · 10-19 18:40 · 已批准</span><span class="badge ok">已上传</span></div></div>
            <div class="bi"><span class="thumb" data-art="cable"></span><div><b lang="ja">デスクケーブルオーガナイザー</b><span class="mono">CP-0003-b81e4d22</span><span class="s">同意 2 · 10-20 10:07 · 已批准</span><span class="badge block">失败</span></div></div>
          </div>
          <div class="grp">
            <div class="gh"><span lang="ja">ペット用品 &gt; ブラシ・コーム</span><span class="tag">模板 v1</span></div>
            <div class="bi"><span class="thumb" data-art="brush"></span><div><b lang="ja">ペット用ブラシ 抜け毛クリーナー</b><span class="mono">CP-0004-6c05e9af</span><span class="s">同意 2 · 10-20 10:12 · 已批准</span><span class="badge block">失败</span></div></div>
          </div>
          <p class="small faint" style="margin:8px 0 6px">每个末级类目一个模板（官方限制），一行一个 SKU。</p>
          <div class="xi">
            <span class="thumb sm" data-art="powerbank"></span><div><b lang="ja">LEDデスクライト 充電式</b><span class="s">已排除：打包时重检命中 G0 · 含电池</span></div><span class="badge block">不进批次</span>
          </div>
          <div class="divider" style="margin:12px 0"></div>
          <dl class="kv small"><dt>每批上限</dt><dd>20 个品（本批 4）</dd><dt>失败重试</dt><dd>不自动重试，须你确认</dd><dt>关联键</dt><dd>卖家 SKU 末 8 位 = 批准内容指纹</dd></dl>
        </div>

        <!-- 右：五步流程 -->
        <div class="stack">

          <div class="card sc1">
            <div class="card-head"><h2><span class="no">1</span>生成</h2><span class="meta">10-20 10:20 · 系统</span><div class="tools"><span class="badge ok">完成</span></div></div>
            <div class="chk3">
              <div><span class="ok">✓</span><b>模板版本</b><span class="s">3 个类目模板 v3 / v2 / v1，与你上次上传的一致</span></div>
              <div><span class="ok">✓</span><b>列映射</b><span class="s">全部列已映射；版本或列变了会停在这一步，不猜</span></div>
              <div><span class="ok">✓</span><b>素材包</b><span class="s">36 图（9 图 × 4 品）+ 4 段视频 · 按卖家 SKU 命名</span></div>
            </div>
          </div>

<script>
(function(){
  /* 素材包缩略图墙 */
  var w='', K=['','','','','s','p','z','z'];
  K.forEach(function(k){ w+='<div class="ph"><span class="af" data-art="divider"'+(k==='z'?' style="transform:scale(1.6)"':k==='p'?' style="inset:20%;border-radius:6px;overflow:hidden"':'')+'></span></div>'; });
  w+='<div class="ph v" data-tip="竖版视频 9:16 · 18 秒"></div>';
  var wall=document.getElementById('wall'); wall.innerHTML=w; CP.hydrate(wall);

  /* 逐行复制 → 行标记已复制，进度环实时更新 */
  var fl=document.getElementById('fl'), rows=fl.querySelectorAll('tr'), L=2*Math.PI*28;
  function ring(){
    var n=fl.querySelectorAll('tr.done').length, t=rows.length;
    document.getElementById('cringFg').setAttribute('stroke-dasharray',(L*n/t).toFixed(1)+' '+L.toFixed(1));
    document.getElementById('cringT').textContent=n;
    document.getElementById('cringL').textContent='已复制 '+n+'/'+t;
    document.getElementById('cring').classList.toggle('full',n===t);
  }
  fl.addEventListener('click',function(e){
    var b=e.target.closest('[data-copy]'); if(!b) return;
    var tr=b.closest('tr'); tr.classList.add('done'); b.textContent='✓ 已复制'; ring();
  });
  document.getElementById('copyAll').addEventListener('click',function(){
    var tt=document.querySelector('.tabs [role=tab][data-tab=todo]'); if(tt) tt.click();
    rows.forEach(function(tr){ tr.classList.add('done'); var b=tr.querySelector('[data-copy]'); if(b) b.textContent='✓ 已复制'; }); ring();
  });
  ring();

  /* 联盟：勾选后佣金率必填 */
  var aff=document.getElementById('aff'), rate=document.getElementById('affRate'), save=document.getElementById('affSave');
  function affUpd(){ document.getElementById('affRow').hidden=!aff.checked; var bad=aff.checked&&!(parseFloat(rate.value)>0); save.disabled=bad; save.classList.toggle('disabled',bad); }
  aff.addEventListener('change',affUpd); rate.addEventListener('input',affUpd);
  /* 审核结果：驳回时原因必填 */
  document.querySelectorAll('input[name=rv]').forEach(function(r){ r.addEventListener('change',function(){ document.getElementById('rejBox').hidden = r.value!=='rej'; }); });
  /* 非关键差异：理由必填 */
  var why=document.getElementById('softWhy'), sok=document.getElementById('softOk');
  why.addEventListener('input',function(){ var e=!why.value.trim(); sok.disabled=e; sok.classList.toggle('disabled',e); });

  /* 标签页 → 右栏时间线 */
  var MAP={batch:'detail-tpl',todo:'d-todo',ok:'d-ok',bad:'d-bad',soft:'d-soft',dead:'d-dead'};
  document.addEventListener('click',function(e){
    var t=e.target.closest('.tabs [role=tab]'); if(!t||!MAP[t.dataset.tab]) return;
    var d=document.getElementById('detail'); d.innerHTML=document.getElementById(MAP[t.dataset.tab]).innerHTML; CP.hydrate(d); d.scrollTop=0;
  });
  var hx=document.querySelector('.tabs [role=tab][data-tab="'+location.hash.slice(1)+'"]'); if(hx) hx.click();
})();
</script>

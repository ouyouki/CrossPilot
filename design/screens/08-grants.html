<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>授权清单 · CrossPilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/cp2.css">
<style>
/* —— 授权清单页专用 —— */
.gcard{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-1);padding:18px 20px 20px;cursor:pointer;transition:box-shadow .12s}
.gcard:hover{box-shadow:var(--shadow-2)}
.gcard.sel{box-shadow:0 0 0 2px var(--primary),var(--shadow-1)}
.gcard .gh{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.gcard .gh .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--primary-bg);color:var(--primary-strong)}
.gcard .gh .ico svg{width:20px;height:20px}
.gcard .gh h2{font-size:17px}
.gcard .gh .sub{font-size:14px;color:var(--text-3);margin-top:2px}
.gcard .gh .tools{margin-left:auto;display:flex;gap:8px;flex:none}
.gcard.susp .gh .ico{background:var(--block-bg);color:var(--block)}
.gcard.exp,.gcard.revoked{background:var(--surface-2);box-shadow:none}
.gcard.exp .gh .ico,.gcard.revoked .gh .ico{background:var(--surface-3);color:var(--text-3)}
.gcard.revoked .env-grid{opacity:.5;filter:grayscale(1)}
.env-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.env{background:var(--surface-2);border-radius:12px;padding:12px 14px;min-width:0}
.gcard.exp .env{background:var(--surface)}
.env .lab{font-size:14px;color:var(--text-3);display:flex;justify-content:space-between;gap:6px}
.env .val{font-size:17px;font-weight:600;line-height:1.35}
.env .val small{font-size:14px;font-weight:400;color:var(--text-3)}
.track{position:relative;height:8px;border-radius:4px;background:var(--surface-3);margin:30px 2px 20px}
.track i,.samp i,.dots i{font-style:normal}
.track .rng{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--primary);transition:left .2s,width .2s}
.track .rng.soft{background:color-mix(in srgb,var(--primary) 30%,transparent)}
.track .mk{position:absolute;top:-5px;width:2px;height:18px;margin-left:-1px;border-radius:1px;background:var(--text-2);transition:left .2s}
.track .mk span{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;white-space:nowrap;font-weight:600}
.track .mk.up span{bottom:20px} .track .mk.dn span{top:20px}
.track .mk.block{background:var(--block)} .track .mk.block span{color:var(--block)}
.track .mk.pri{background:var(--primary-strong)} .track .mk.pri span{color:var(--primary-strong)}
.track .mk.tgt span{color:var(--text-2)}
.track .tk{position:absolute;top:1px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1.5px var(--text-2)}
.track .ends{position:absolute;top:14px;font-size:13px;color:var(--text-3)}
.dots{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.dots .d{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--text-3)}
.dots .d i{width:10px;height:10px;border-radius:3px;background:var(--surface-3);display:block}
.dots .d i.on{background:var(--primary)}
.dots .d i.off{background:transparent;box-shadow:inset 0 0 0 1px var(--border-strong)}
.dots .d.today{color:var(--primary-strong);font-weight:600}
.envring{display:flex;align-items:center;gap:12px;margin-top:6px}
.samp{display:flex;gap:4px;margin-top:10px}
.samp i{width:18px;height:18px;border-radius:5px;background:var(--surface-3);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600}
.samp i.p{background:var(--wait-bg);color:var(--wait)} .samp i.ok{background:var(--ok-bg);color:var(--ok)} .samp i.bad{background:var(--block-bg);color:var(--block)}
.narrow{margin-top:14px;background:var(--primary-bg);border-radius:14px;padding:16px 18px;cursor:default}
.narrow[hidden]{display:none}
.narrow h3{font-size:15px;color:var(--primary-strong);margin-bottom:2px}
.narrow .nrow{display:grid;grid-template-columns:96px minmax(0,1fr) 120px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--primary) 18%,transparent)}
.narrow .nrow:first-of-type{border-top:0}
.narrow .nrow label{font-size:14px;color:var(--text-2);font-weight:500}
.narrow .nrow output{font-weight:600;font-size:15px;text-align:right}
.narrow .nrow .hint{grid-column:2 / 4;font-size:13px;color:var(--text-3);margin-top:-6px}
.narrow .seg button[disabled]{opacity:.35;cursor:not-allowed}
.narrow .preview{font-size:14px;color:var(--text-2);background:var(--surface);border-radius:10px;padding:8px 12px;margin-top:8px;min-height:34px}
.narrow .preview b{color:var(--primary-strong)}
.dual{position:relative;height:26px}
.dual input[type=range]{position:absolute;left:0;right:0;top:4px;pointer-events:none;background:transparent;-webkit-appearance:none;appearance:none;height:18px;margin:0}
.dual input[type=range]::-webkit-slider-thumb{pointer-events:auto}
.dual input[type=range]::-moz-range-thumb{pointer-events:auto}
.dual::before{content:"";position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:var(--surface-3)}
.never{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.never .nv{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.never .nv .lk{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--block-bg);color:var(--block)}
.never .nv .lk svg{width:15px;height:15px}
.never .nv b{font-size:15px;line-height:1.35}
.never .nv span{font-size:13px;color:var(--text-3);line-height:1.45}
.pend{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.pend .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--wait-bg);color:var(--wait)}
.pend .ico svg{width:22px;height:22px}
.tl-prod{display:flex;gap:10px;align-items:center;margin-top:4px}
.ref{font:500 13px var(--font-mono);color:var(--primary-strong)}
@media (max-width:1280px){.never{grid-template-columns:repeat(2,minmax(0,1fr))}.env-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body data-page="grants" data-crumb="治理 / 授权清单">

          </div>

      </div>

<script>
(function(){
  var main=document.getElementById('main');
  function yen(n){ return '¥'+Number(n).toLocaleString('ja-JP'); }
  function dayDiff(a,b){ return Math.round((new Date(b)-new Date(a))/864e5); }
  var LABEL={margin:'毛利下限',pmin:'价格带下沿',pmax:'价格带上沿',total:'总次数上限',exp:'到期日',samp:'抽检比例'};
  var RULE={margin:'毛利下限只能上调',pmin:'价格带只能内缩',pmax:'价格带只能内缩',total:'总次数只能减少',exp:'有效期只能提前',samp:'抽检比例只能提高'};
  function fmt(k,v){ return k==='margin'?'≥ '+v+'%':(k==='pmin'||k==='pmax')?yen(v):k==='total'?v+' 次':k==='samp'?v+'%':v; }

  // 自动选中第一张授权卡
  var first=document.getElementById('card-g1'); if(first) first.click();

  // 展开/收起收窄面板
  main.addEventListener('click',function(e){
    var t=e.target.closest('[data-narrow-toggle]'); if(!t) return;
    var p=document.getElementById(t.dataset.narrowToggle); if(p) p.hidden=!p.hidden;
  });

  function preview(panel){
    var out=[];
    panel.querySelectorAll('[data-narrow]').forEach(function(i){ if(String(i.value)!==String(i.dataset.cur)) out.push(LABEL[i.dataset.narrow]+' '+fmt(i.dataset.narrow,i.dataset.cur)+' → <b>'+fmt(i.dataset.narrow,i.value)+'</b>'); });
    var seg=panel.querySelector('[data-narrow-seg]');
    if(seg){ var on=seg.querySelector('[aria-pressed=true]'); if(on && on.dataset.val!==seg.dataset.cur) out.push('每日上限 '+seg.dataset.cur+' → <b>'+on.dataset.val+'</b>'); }
    panel.querySelectorAll('[data-narrow-cat]:checked').forEach(function(c){ out.push('去掉类目 <b>'+c.dataset.narrowCat+'</b>'); });
    panel.querySelector('[data-preview]').innerHTML = out.length ? '收窄后：'+out.join('；') : '还没有改动。';
    return out.length;
  }

  // 夹紧：只能往更严的方向
  main.addEventListener('input',function(e){
    var i=e.target; if(!i.dataset || !i.dataset.narrow) return;
    var panel=i.closest('.narrow'), k=i.dataset.narrow, dir=i.dataset.dir, cur=i.dataset.cur, v=i.value;
    var num=k!=='exp', bad = num ? (dir==='up' ? +v < +cur : +v > +cur) : (v > cur || v==='');
    if(bad){ i.value=cur; if(window.CP&&CP.toast) CP.toast('只能往更严的方向：'+RULE[k]); }
    if(k==='pmin'||k==='pmax'){
      var lo=panel.querySelector('[data-narrow=pmin]'), hi=panel.querySelector('[data-narrow=pmax]');
      if(+lo.value>+hi.value){ if(k==='pmin') lo.value=hi.value; else hi.value=lo.value; }
      panel.querySelector('[data-out-price]').textContent=yen(lo.value)+' – '+yen(hi.value);
    }
    if(i.dataset.out){ var o=document.getElementById(i.dataset.out); if(o) o.textContent=fmt(k,i.value); }
    preview(panel);
  });
  main.addEventListener('change',function(e){ var c=e.target; if(c.dataset && c.dataset.narrowCat!==undefined){ var p=c.closest('.narrow'); var all=p.querySelectorAll('[data-narrow-cat]'), n=p.querySelectorAll('[data-narrow-cat]:checked').length; if(n===all.length){ c.checked=false; CP.toast('至少保留 1 个类目；全部去掉请直接撤销'); } preview(p); } });
  main.addEventListener('click',function(e){
    var b=e.target.closest('[data-narrow-seg] button'); if(!b) return;
    var seg=b.parentElement; if(+b.dataset.val>+seg.dataset.cur){ CP.toast('只能往更严的方向：每日上限只能减少'); return; }
    seg.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed',x===b); });
    var o=seg.closest('.nrow').querySelector('[data-out-daily]'); if(o) o.textContent='≤ '+b.dataset.val+' 次/日';
    preview(seg.closest('.narrow'));
  });

  // 提交收窄：更新卡片上的包络
  main.addEventListener('click',function(e){
    var s=e.target.closest('[data-narrow-submit]'); if(!s) return;
    var panel=document.getElementById(s.dataset.narrowSubmit), card=document.getElementById(panel.dataset.card);
    if(!preview(panel)){ CP.toast('没有改动：只能往更严的方向收窄'); return; }
    function q(n){ return card.querySelector('[data-v="'+n+'"]'); }
    function inp(n){ return panel.querySelector('[data-narrow='+n+']'); }
    var m=inp('margin'); if(m){ var mp=m.value*2; q('margin-mk').style.left=mp+'%'; q('margin-rng').style.left=mp+'%'; q('margin-rng').style.width=(100-mp)+'%'; q('margin-lbl').textContent='下限 '+m.value+'%'; q('margin').innerHTML='≥ '+m.value+'% <small>已收窄</small>'; }
    var lo=inp('pmin'), hi=inp('pmax'); if(lo){ q('price').textContent=yen(lo.value)+' – '+yen(hi.value); q('price-rng').style.left=(lo.value/40)+'%'; q('price-rng').style.width=((hi.value-lo.value)/40)+'%'; }
    var seg=panel.querySelector('[data-narrow-seg]'); if(seg){ var d=seg.querySelector('[aria-pressed=true]').dataset.val; q('daily').textContent=d; if(q('daily2')) q('daily2').textContent=d; seg.dataset.cur=d;
      seg.querySelectorAll('button').forEach(function(x){ x.disabled=+x.dataset.val>+d; x.textContent=x.dataset.val+(x.dataset.val===d?'（当前）':''); }); }
    var t=inp('total'); if(t && q('total-ring')){ var used=2, el=q('total-ring'); el.dataset.mounted=''; el.dataset.cfg=JSON.stringify({pct:used/t.value*100,size:64,stroke:8,label:used+'/'+t.value,fs:14,color:'primary'}); CP.hydrate(card); q('total-left').textContent=t.value-used; }
    var x=inp('exp'); if(x){ q('exp').textContent=x.value; q('exp-end').textContent=x.value.slice(5); q('days').textContent=dayDiff('2026-10-20',x.value); }
    var sp=inp('samp'); if(sp && q('samp')) q('samp').textContent=sp.value;
    // 新值成为新的“当前值”，之后只能更严
    panel.querySelectorAll('[data-narrow]').forEach(function(i){ i.dataset.cur=i.value; if(i.type==='range'){ if(i.dataset.dir==='up') i.min=i.value; else i.max=i.value; } else if(i.type==='date'){ i.max=i.value; } });
    panel.querySelectorAll('[data-narrow-cat]:checked').forEach(function(c){ c.disabled=true; c.closest('label').style.textDecoration='line-through'; });
    panel.querySelector('[data-preview]').textContent='已收窄并立即生效。新的值就是之后能收窄的起点。';
  });

  // 撤销：一键、立即、无理由
  main.addEventListener('click',function(e){
    var r=e.target.closest('[data-revoke]'); if(!r) return;
    var card=document.getElementById(r.dataset.revoke); if(!card) return;
    var st=card.querySelector('[data-v=status]'); var wasActive=st && st.textContent==='生效中';
    if(card.classList.contains('pend')){ card.style.opacity='.5'; card.querySelector('.meter').classList.remove('wait'); card.querySelector('.meter i').style.background='var(--text-3)'; card.querySelector('.nowrap').textContent='已撤销 · 不会生效'; r.disabled=true; return; }
    card.classList.add('revoked'); if(st){ st.className='badge'; st.textContent='已撤销'; }
    card.querySelectorAll('.gh .tools button').forEach(function(b){ b.disabled=true; });
    var n=card.querySelector('.narrow'); if(n) n.hidden=true;
    if(wasActive){ var c=document.querySelector('[data-v=active-count]'); if(c) c.textContent=Math.max(0,+c.textContent-1); }
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>素材 · CrossPilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/cp2.css">
<style>
/* ===== 素材页专用 ===== */
.as-layout{display:grid;grid-template-columns:188px minmax(0,1fr);gap:16px;align-items:start}
.plist{display:flex;flex-direction:column;gap:8px;position:sticky;top:76px}
.plist h4{margin:0 0 2px;font:500 13px var(--font-mono);letter-spacing:.12em;color:var(--text-3)}
.pi{display:grid;grid-template-columns:50px minmax(0,1fr);gap:10px;align-items:center;text-align:left;width:100%;background:var(--surface);border:0;border-radius:14px;padding:10px;box-shadow:var(--shadow-1);cursor:pointer;color:var(--text);transition:box-shadow .12s,background .12s}
.pi:hover{background:var(--surface-2)}
.pi[aria-selected=true]{background:var(--primary-bg);box-shadow:0 0 0 2px var(--primary)}
.pi .t{font-size:14px;font-weight:600;line-height:1.35;display:block;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pi .m{display:flex;flex-direction:column;gap:4px;margin-top:4px;font-size:13px;color:var(--text-3)}
.pi .badge{align-self:flex-start;height:20px;font-size:13px;padding:0 8px}
.sring{--p:50%;--c:var(--ok);width:50px;height:50px;border-radius:14px;padding:3px;background:conic-gradient(var(--c) var(--p),var(--surface-3) 0)}
.sring .thumb{width:44px;height:44px;border-radius:11px;box-shadow:0 0 0 2px var(--surface)}
.plist .sum{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--text-2);line-height:1.6}

.pane-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.pane-head h2{font-size:20px}
.pane-head .meta{font-size:14px;color:var(--text-3)}
.sec{margin-bottom:16px}

/* 手机预览 + 文案 */
.pv{display:grid;grid-template-columns:244px minmax(0,1fr);gap:16px;align-items:start}
.phone{width:244px}
.phone .gal{position:relative}
.phone .gal .ph{border-radius:0}
.phone .dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:4px}
.phone .dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.7)}
.phone .dots i:first-child{background:#fff;width:14px;border-radius:3px}
.phone .cnt{position:absolute;right:8px;top:8px;font-size:12px;background:rgba(0,0,0,.45);color:#fff;border-radius:8px;padding:0 6px}
.phone .p-price{display:flex;align-items:baseline;gap:2px}
.phone .p-shop{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:6px solid #F3F3F3;font-size:13px;color:#555}
.phone .p-shop i{width:22px;height:22px;border-radius:50%;background:#E8EEED;display:inline-block}
.phone .p-row b{color:#111;font-weight:600}
.phone .p-cta{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 12px 12px}
.phone .p-cta span{height:30px;border-radius:15px;display:grid;place-items:center;font-size:13px;font-weight:600}
.phone .p-cta span:first-child{background:#FFE5E8;color:#E8233B} .phone .p-cta span:last-child{background:#E8233B;color:#fff}
.phone mark.hit{background:#FBE4E2;color:#B3261E}
.phone-cap{text-align:center;font-size:13px;color:var(--text-3);margin-top:8px}

.cp{display:flex;flex-direction:column;gap:6px}
.cp-row{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:10px;padding:9px 10px;border-radius:10px;background:var(--surface-2);font-size:12.5px;line-height:1.55}
.cp-row .lb{font:500 13px var(--font-mono);color:var(--text-3);padding-top:2px}
.cp-row .cn{color:var(--text-2)}
.cp-row .tm{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap}
.cp-row .tm .badge{height:20px;font-size:13px}
.cp-row.block{background:var(--block-bg)} .cp-row.warn{background:var(--wait-bg)}
.cp-head{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:10px;padding:0 10px;font-size:13px;color:var(--text-3);letter-spacing:.06em}
mark{border-radius:4px;padding:0 2px}
mark.hit{background:var(--block);color:var(--surface);font-weight:600}
mark.wr{background:color-mix(in srgb,var(--wait-solid) 45%,transparent);color:inherit}
mark.term{background:var(--info-bg);color:var(--info)}
.intro{font-size:12.5px;line-height:1.8;white-space:pre-line}

/* 9 宫格 */
.gallery{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:0;padding:0;background:none;cursor:pointer;text-align:left;border-radius:12px;color:inherit;position:relative}
.tile .ph{box-shadow:0 0 0 1px var(--border)}
.tile[aria-pressed=true] .ph{box-shadow:0 0 0 3px var(--primary)}
.tile .cap{display:flex;justify-content:space-between;gap:4px;font-size:13px;color:var(--text-3);margin-top:4px;white-space:nowrap;overflow:hidden}
.ph .af{position:absolute;inset:0;display:block}
.ph .af svg{width:100%;height:100%}
.ph .af.zoom svg{transform:scale(1.75) translate(4%,6%)}
.ph .af.small{inset:16% 16% 22% 16%;border-radius:10px;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.15)}
.ph .band{position:absolute;left:0;right:0;bottom:0;padding:5px 6px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--ink) 78%,transparent);color:#fff;text-align:center;line-height:1.3}
.ph .band.hit{background:var(--block);color:#fff}
.ph .dim{position:absolute;inset:0;width:100%;height:100%}
.ph .scene{position:absolute;inset:0;background:linear-gradient(180deg,var(--art-e) 0 62%,var(--art-b) 62%)}
.ph .wm{position:absolute;right:5px;top:5px;font-size:11px;font-weight:600;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.55);color:#fff}
.ph .lv{position:absolute;left:5px;top:5px;font:600 12px var(--font-mono);padding:2px 5px;border-radius:5px;background:var(--surface);color:var(--text-2)}
.ph .lv.L2{background:var(--wait-bg);color:var(--wait)}
.ph .no{position:absolute;left:5px;bottom:5px;font:600 12px var(--font-mono);color:var(--text-3)}
.ph.photo{filter:saturate(.75) contrast(.95)}
.cmpbox{background:var(--surface-2);border-radius:14px;padding:14px}
.cmpbox .cmp .lab{font-size:13px;color:var(--text-3);margin-top:4px}
.licbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

/* 视频 */
.vid{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:start}
.player{position:relative;border-radius:14px;overflow:hidden;background:var(--ink);aspect-ratio:9/16;box-shadow:var(--shadow-2)}
.player .af{position:absolute;left:0;right:0;top:18%;height:46%}
.player .play{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;border:0;cursor:pointer}
.player .play::after{content:"";border-left:12px solid #10262A;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.player .sub{position:absolute;left:8px;right:8px;bottom:30px;text-align:center;font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.player .prog{position:absolute;left:8px;right:8px;bottom:12px;height:3px;border-radius:2px;background:rgba(255,255,255,.25)}
.player .prog i{display:block;width:34%;height:100%;background:#fff;border-radius:2px}
.player .aitag{position:absolute;left:8px;top:8px;font-size:12px;font-weight:600;background:rgba(0,0,0,.55);color:#fff;border-radius:4px;padding:1px 6px}
.sb{display:flex;flex-direction:column;gap:6px}
.sb .trk{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:center;font-size:13px;color:var(--text-3)}
.sb .lane{display:flex;gap:3px;height:42px}
.sb .seg{border-radius:7px;overflow:hidden;position:relative;background:var(--surface-3);display:flex;gap:2px;padding:2px}
.sb .seg .fr{flex:1;border-radius:5px;overflow:hidden;position:relative;min-width:0}
.sb .seg .fr .af{position:absolute;inset:0}
.sb .seg.open{background:var(--primary-bg);color:var(--primary-strong);display:grid;place-items:center;font-size:13px;font-weight:600}
.sb .seg.end{background:var(--surface-3);display:grid;place-items:center;font-size:13px;color:var(--text-2)}
.sb .lane.thin{height:22px}
.sb .lane.thin .seg{display:flex;align-items:center;padding:0 8px;font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden}
.sb .ruler{display:flex;justify-content:space-between;font:500 12px var(--font-mono);color:var(--text-3);margin-left:70px}
.checks{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px}
.checks li{display:flex;gap:6px;align-items:flex-start}
.checks li::before{content:"✓";color:var(--ok);font-weight:600}
.checks li.w::before{content:"!";color:var(--wait)}

/* 合规报告 */
.heat{display:flex;gap:10px;align-items:flex-end}
.heat .grp{min-width:0} .heat .cells i{flex:1;width:auto}
.heat .grp{display:flex;flex-direction:column;gap:5px}
.heat .cells{display:flex;gap:2px}
.heat .cells i{width:15px;height:22px;border-radius:4px;background:var(--ok);opacity:.85;display:block;cursor:default}
.heat .cells i.w{background:var(--wait-solid);opacity:1}
.heat .cells i.b{background:var(--block);opacity:1}
.heat .gl{font:500 12px var(--font-mono);color:var(--text-3)}
.heat-sum{display:flex;gap:16px;font-size:14px;margin-top:10px;color:var(--text-2)}
.heat-sum b{font-size:18px;font-weight:600;margin-right:4px}
.hit-card{border-radius:14px;padding:14px 16px;margin-top:12px}
.hit-card.block{background:var(--block-bg)} .hit-card.warn{background:var(--wait-bg)}
.hit-card .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hit-card .hd b{font-size:16px}
.hit-card.block .hd b{color:var(--block)} .hit-card.warn .hd b{color:var(--wait)}
.hit-card .kv{font-size:12.5px}
.hit-card .kv dt{color:var(--text-2)}
.hit-card .fix{background:var(--surface);border-radius:10px;padding:8px 10px;margin-top:2px}
.gtbl td{padding:9px 12px}
.gtbl .meter{width:120px}

/* 价格卡 */
.price{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:start}
.pbar{position:relative;height:56px;margin:22px 4px 0}
.pbar .ax{position:absolute;left:0;right:0;top:24px;height:8px;border-radius:4px;background:var(--surface-3)}
.pbar .band{position:absolute;top:24px;height:8px;background:var(--primary-bg);border-radius:4px}
.pbar .mk{position:absolute;top:12px;width:2px;height:32px;transform:translateX(-1px)}
.pbar .mk span{position:absolute;top:34px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;color:var(--text-3)}
.pbar .mk.floor{background:var(--block)} .pbar .mk.floor span{color:var(--block);font-weight:600;top:-16px}
.pbar .mk.line{background:var(--text-3)}
.pbar .dot{position:absolute;top:19px;width:18px;height:18px;border-radius:50%;background:var(--primary);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--primary);transform:translateX(-9px);transition:left .2s}
.pbar .dot.bad{background:var(--block);box-shadow:0 0 0 1px var(--block)}
.pbar .dot span{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.trial{display:flex;align-items:center;gap:8px;margin-top:14px}
.trial .input{width:110px}
.trial-out{font-size:14px}
.trial-out.bad{color:var(--block);font-weight:600}
.pkv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;margin:10px 0 0}
.pkv dt{color:var(--text-3)} .pkv dd{margin:0;text-align:right}
.pcard-bad .pbig{color:var(--block)}
.pbig{font-size:28px;font-weight:600;letter-spacing:-.02em}
.ret{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.note-bad{font-size:14px;color:var(--block);font-weight:500}
.card-head .seg button{white-space:nowrap}
.card-head h2{white-space:nowrap}
[hidden]{display:none!important}
</style>
</head>

<script>
(function(){
  var LIC = {sup:['supplier_license','供应商书面授权'], own:['own_shot','自有拍摄'], ai:['ai_from_own_photo','自有实拍为底图的 AI 加工']};
  var EV = {
    sup:'供应商授权书.pdf · 2026-10-18 上传 · 授权链声明：授权方为权利人',
    own:'自有拍摄原图 · 样品拍摄记录 2026-10-17',
    ai:'底图为自有实拍（图 8），商品本体像素与比例未改动'
  };
  /* [名称, AIGC, 授权, 形态, 文字层] 形态：main 主图 / pt 卖点 / spec 规格 / scene 场景 / pack 包装 / zoom 细节 */
  var SETS = {
    spoons:{art:'spoons', items:[['白底主图','L1','sup','main'],['卖点图·耐熱','L1','sup','pt','耐熱230℃'],['卖点图·食洗機','L1','sup','pt','食洗機OK'],['规格图','L1','sup','spec','全長約28cm'],['场景图（AI 场景）','L2','ai','scene'],['卖点图·収納','L1','sup','pt','吊り下げ収納'],['包装图','L0','own','pack'],['细节图','L0','own','zoom'],['配件图','L0','own','zoom']]},
    cable:{art:'cable', items:[['白底主图','L1','sup','main'],['卖点图·5連','L1','sup','pt','5本まとめて'],['规格图','L1','sup','spec','幅約8cm'],['卖点图·貼るだけ','L1','sup','pt','工具不要'],['细节图','L0','own','zoom'],['场景图（AI 场景）','L2','ai','scene'],['卖点图·シリコン','L1','sup','pt','シリコン製'],['包装图','L0','own','pack'],['使用图','L1','sup','main']]},
    brush:{art:'brush', items:[['白底主图','L1','sup','main'],['卖点图·ワンタッチ','L1','sup','pt','ワンタッチで除去'],['卖点图·涙やけ','L1','sup','pt','涙やけのシミが消える','hit'],['规格图','L1','sup','spec','全長約18cm'],['细节图','L0','own','zoom'],['卖点图·犬猫','L1','sup','pt','犬・猫OK'],['包装图','L0','own','pack'],['细节图·ピン','L0','own','zoom'],['使用图','L1','sup','main']]}
  };
  function face(set,t,i,photo){
    var a=set.art, k=t[3], h='<div class="ph'+(photo?' photo':'')+'">';
    if(k==='scene'){ h+='<span class="scene"></span><span class="af small" data-art="'+a+'"></span>'; if(!photo) h+='<span class="wm">AI生成</span>'; }
    else if(k==='zoom'){ h+='<span class="af zoom" data-art="'+a+'"></span>'; }
    else if(k==='pack'){ h+='<span class="af small" data-art="'+a+'" style="inset:20%"></span>'; }
    else { h+='<span class="af" data-art="'+a+'"></span>'; }
    if(k==='spec' && !photo){ h+='<svg class="dim" viewBox="0 0 100 100" aria-hidden="true"><path d="M10 90 H90 M10 86 V94 M90 86 V94" stroke="var(--text-2)" stroke-width="1.2" fill="none"/></svg><span class="band">'+t[4]+'</span>'; }
    if(k==='pt' && !photo){ h+='<span class="band'+(t[5]?' hit':'')+'" lang="ja">'+t[4]+'</span>'; }
    if(!photo){ h+='<span class="lv '+t[1]+'">'+t[1]+'</span>'; }
    return h+'</div>';
  }
  document.querySelectorAll('[data-tiles]').forEach(function(box){
    var key=box.dataset.tiles, set=SETS[key], h='';
    set.items.forEach(function(t,i){
      h+='<button class="tile" data-i="'+i+'" data-set="'+key+'" aria-pressed="'+(i===(key==='brush'?2:4)?'true':'false')+'">'+face(set,t,i)
        +'<span class="cap"><span>图 '+(i+1)+' · '+t[0].split('（')[0].split('·')[0]+'</span></span></button>';
    });
    box.innerHTML=h; CP.hydrate(box);
  });
  function showCmp(key,i){
    var set=SETS[key], t=set.items[i], n=i+1, l2=t[1]==='L2', hit=t[5];
    var base = t[2]==='ai' ? '自有实拍（图 8）' : (t[2]==='own' ? '样品实拍原图' : '供应商图包 #0'+n);
    var h='<div class="row between" style="margin-bottom:10px"><b style="font-size:15px">图 '+n+' · '+t[0]+'</b><span class="badge'+(l2?' wait':'')+'">AIGC '+t[1]+'</span></div>'
      +'<div class="cmp"><div>'+face(set,[t[0],t[1],t[2],t[3]==='scene'?'main':t[3]],i,true)+'<div class="lab">依据图 · '+base+'</div></div>'
      +'<div>'+face(set,t,i,false)+'<div class="lab">本张（派生图）</div></div></div>'
      +'<dl class="kv" style="margin-top:12px;font-size:14px"><dt>授权类型</dt><dd><span class="tag">'+LIC[t[2]][0]+'</span> '+LIC[t[2]][1]+'</dd>'
      +'<dt>授权证据</dt><dd>'+EV[t[2]]+'</dd><dt>相似度</dt><dd>与本店已有素材最高 0.41（阈值 0.9）</dd></dl>';
    if(l2) h+='<div class="alert wait" style="margin-top:10px"><span><b>WARN</b> AI 生成场景：仅当以本 SKU 实拍为底图且商品本体未改动时可用；已标注「AI生成」，同意 2 时逐条确认。</span></div>';
    if(hit) h+='<div class="alert block" style="margin-top:10px"><span><b>BLOCK G2-001</b> 文字层 OCR「<span lang="ja">涙やけのシミが消える</span>」（泪痕污渍会消失）。只能改文字层或换图。</span></div>';
    var box=document.querySelector('[data-cmp="'+key+'"]'); box.innerHTML=h; CP.hydrate(box);
  }
  showCmp('spoons',4); showCmp('cable',5); showCmp('brush',2);
  document.addEventListener('click',function(e){
    var tile=e.target.closest('.tile'); if(!tile) return;
    tile.parentElement.querySelectorAll('.tile').forEach(function(x){ x.setAttribute('aria-pressed', x===tile); });
    showCmp(tile.dataset.set, +tile.dataset.i);
  });

  /* 合规热力条：G1 6 · G2 11 · G3 10 · G4 5 = 32 项 */
  var RULES = {
    G1:['G1-001 特商法表示','G1-002 送料','G1-003 発送までの日数','G1-004 返品条件','G1-005 原産国','G1-006 税込総額表示'],
    G2:['G2-001 功效/医疗暗示','G2-002 最上級・No.1','G2-003 二重価格','G2-004 ステマ','G2-005 数字断言来源','G2-006 品牌/IP 词','G2-007 敏感表达','G2-008 机翻腔','G2-009 原産国誤認','G2-010 健康暗示','G2-011 简体字形混入'],
    G3:['G3-001 授权类型','G3-002 AIGC 标注 · 图片','G3-002 AIGC 标注 · 视频','G3-003 水印/logo · 图片','G3-003 水印/logo · 视频','G3-004 人脸','G3-005 近同素材','G3-006 认证标志','G3-007 BGM 登记','G3-007 字体登记'],
    G4:['G4-001 张数 ≤9','G4-001 尺寸/格式','G4-002 视频规格','G4-003 字符上限','G4-004 类目必填属性']
  };
  var HITS = { spoons:{'G3-002 AIGC 标注 · 图片':'w'}, cable:{'G2-008 机翻腔':'w','G3-002 AIGC 标注 · 图片':'w'}, brush:{'G2-001 功效/医疗暗示':'b','G2-008 机翻腔':'w'} };
  var NAMES = {G1:'G1 必备表示',G2:'G2 文案',G3:'G3 图片视频',G4:'G4 平台规格'};
  document.querySelectorAll('[data-heat]').forEach(function(box){
    var hits=HITS[box.dataset.heat], h='';
    Object.keys(RULES).forEach(function(g){
      h+='<div class="grp" style="flex:'+RULES[g].length+'"><div class="cells">'+RULES[g].map(function(r){ var s=hits[r]; return '<i class="'+(s||'')+'" data-tip="'+r+' · '+(s==='b'?'BLOCK':s==='w'?'WARN':'通过')+'"></i>'; }).join('')+'</div><span class="gl">'+NAMES[g]+'</span></div>';
    });
    box.innerHTML=h;
  });

  /* 价格位置条 + 试算 */
  var COST = { spoons:{fixed:993, rate:(198+59+53)/1980}, brush:{fixed:970, rate:(188+56+46)/1880} };
  function yen(n){ return '¥'+Math.round(n).toLocaleString('ja-JP'); }
  function drawBar(el,p){
    var mn=+el.dataset.min, mx=+el.dataset.max, pos=function(v){ return Math.max(0,Math.min(100,(v-mn)/(mx-mn)*100)); };
    var bad=p<=+el.dataset.floor;
    el.innerHTML='<div class="ax"></div><div class="band" style="left:'+pos(+el.dataset.b0)+'%;width:'+(pos(+el.dataset.b1)-pos(+el.dataset.b0))+'%" data-tip="竞品价格带 '+yen(el.dataset.b0)+'–'+yen(el.dataset.b1)+'"></div>'
      +'<div class="mk floor" style="left:'+pos(+el.dataset.floor)+'%"><span>地板价 '+yen(el.dataset.floor)+'</span></div>'
      +'<div class="mk line" style="left:'+pos(+el.dataset.line)+'%"><span>底线 12% '+yen(el.dataset.line)+'</span></div>'
      +'<div class="dot'+(bad?' bad':'')+'" style="left:'+pos(p)+'%"><span>'+yen(p)+'</span></div>';
  }
  document.querySelectorAll('[data-pbar]').forEach(function(el){ drawBar(el,+el.dataset.p); });
  var priceBad={};
  document.addEventListener('input',function(e){
    var inp=e.target; if(!inp.matches('[data-trial]')) return;
    var key=inp.dataset.trial, c=COST[key], p=parseInt(String(inp.value).replace(/[^\d]/g,''),10);
    var card=inp.closest('section'), out=card.querySelector('[data-trial-out]'), bar=card.querySelector('[data-pbar]'), pv=card.querySelector('[data-pv]');
    if(!p){ out.textContent='请输入整数价格'; out.className='trial-out'; return; }
    var profit=p*(1-c.rate)-c.fixed, m=profit/p*100, floor=+bar.dataset.floor;
    drawBar(bar,p); pv.textContent=yen(p);
    var bad=p<=floor; priceBad[key]=bad; card.classList.toggle('pcard-bad',bad);
    out.className='trial-out'+(bad?' bad':'');
    out.textContent= bad ? '低于成本地板价 '+yen(floor)+'：利润 '+yen(profit)+'，不可送审' : '毛利 '+m.toFixed(1)+'% · '+(m>=12?'高于底线 12%':'低于底线 12%（会在同意 2 被拦）');
    syncSend();
  });

  /* 页首主按钮：随选中商品切换；BLOCK 或低于地板价时禁用并说明 */
  var STATE={spoons:'',cable:'',brush:'有 1 项 BLOCK，改写并重检通过后才能送审'};
  var cur='spoons';
  function syncSend(){
    var b=document.getElementById('sendBtn'), n=document.getElementById('sendNote');
    var why=STATE[cur] || (priceBad[cur]?'售价低于成本地板价，不可送审':'');
    b.disabled=!!why; b.classList.toggle('disabled',!!why); n.hidden=!why; n.textContent=why;
  }
  document.addEventListener('click',function(e){
    var t=e.target.closest('.pi[role=tab]'); if(!t) return;
    cur=t.dataset.tab; syncSend();
    var tpl=document.getElementById(cur==='spoons'?'detail-tpl':'det-'+cur), d=document.getElementById('detail');
    d.innerHTML=tpl.innerHTML; CP.hydrate(d); d.scrollTop=0;
  });
  syncSend();
  /* 深链：05-assets.html#brush 直接打开该商品 */
  var hx=document.querySelector('[role=tab][data-tab="'+location.hash.slice(1)+'"]'); if(hx) hx.click();

  /* 退回原因必选 */
  document.addEventListener('change',function(e){
    var s=e.target; if(!s.matches('[data-reason]')) return;
    var b=s.closest('.ret').querySelector('[data-ret]'); b.disabled=!s.value; b.classList.toggle('disabled',!s.value);
  });
})();
</script>
</body>
</html>
